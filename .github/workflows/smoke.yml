name: smoke

# Asks the live site three read-only questions after every production deploy and once a day: does
# the server load, does it have its settings, and does GitHub accept its token. On 2026-10-14 an
# adapter update made every API route answer 500 for a day while CI stayed green, because nothing
# looked at the deployed site (docs/learnings.md). A run Vercel started belongs to vercel[bot], whose
# failure email reaches no one, so a failed run opens or comments on one issue labelled `smoke` and
# the next passing run closes it (D159). A failed deploy leaves the last good one live, which this
# cannot tell from a skipped one: `singularity health` faults `site_behind` for it a day on.

on:
  deployment_status:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

# One check of the live site at a time, never cancelled, so a failing one always files its issue; a
# newer one waits. Vercel's other events (a pending deploy, a preview) skip the job and get a group
# of their own, so they never take a waiting check's place.
concurrency:
  group: >-
    smoke-${{ (github.event_name != 'deployment_status' ||
    (github.event.deployment_status.state == 'success' &&
    github.event.deployment.environment == 'Production')) && 'live' || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    # Vercel reports every deployment; only a successful production one changes the live site.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://news.someshks.work
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ask the live site
        shell: bash
        run: |
          set -uo pipefail
          # A finished episode run of this repository: the site reads it from GitHub with its token.
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/podcast.yml/runs?event=workflow_dispatch&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty')

          # expect <status> <path> <what a different answer means>
          expect() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE}$2")
            if [ "$code" = "$1" ]; then echo "ok   $2 -> $code"; return 0; fi
            echo "FAIL $2 -> $code (wanted $1): $3"
            return 1
          }

          check() {
            expect 405 /api/podcast "the server does not load" &&
              expect 400 "/api/status?run=x" "the deployment is missing GITHUB_SINGULARITY_TOKEN or GITHUB_REPOSITORY" &&
              { [ -z "$run_id" ] || expect 200 "/api/status?run=${run_id}" "GitHub refused the site's token (expired or revoked GITHUB_SINGULARITY_TOKEN)"; }
          }

          # The domain can take a few seconds to point at a deployment that just finished.
          for attempt in 1 2 3; do
            check && exit 0
            [ "$attempt" = 3 ] || sleep 20
          done
          exit 1

      - name: Tell the owner
        if: always()
        env:
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          # A GitHub hiccup here is a warning on the run, never the site's failure.
          if ! open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label smoke --state open --limit 1 --json number --jq '.[0].number // empty'); then
            echo "::warning::Could not read the smoke issue; this run's result reaches no one."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --repo "$GITHUB_REPOSITORY" --comment "The live site passed on $(date -u +%F) ([run]($RUN_URL))." ||
                echo "::warning::Could not close smoke issue #$open_issue."
            fi
            exit 0
          fi
          [ "$STATUS" = "failure" ] || exit 0
          body="The live site failed its smoke check on $(date -u '+%F %H:%M') UTC; the run names the question it failed: [run]($RUN_URL)."
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create smoke --repo "$GITHUB_REPOSITORY" --color B60205 --description "smoke.yml: the live site failed its smoke check" --force >/dev/null
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Smoke: the live site failed" --label smoke --body "$body" >/dev/null
          fi
