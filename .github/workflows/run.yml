name: run

# A delete run is named for what it does, so the site's rate limit on Regenerate does not count it,
# and a dry run too, so health.yml's run_died and run_cancelled count neither: they write no record.
run-name: ${{ inputs.delete != '' && format('delete {0}', inputs.delete) || inputs.dry_run && 'dry run' || 'run' }}

# Produces a digest on the chosen cadence (schedule), on demand (workflow_dispatch), and the weekly pass.
# Step names are part of a contract: the site's Generate sheet maps them to its progress list.
# Gate, Fetch, Judge, Write, Validate and Commit must keep these exact names.

on:
  schedule:
    # One entry per hour at :13 Stockholm time (off the top of the hour because GitHub delays runs
    # at :00). Only the hour in the repository variable RUN_CRON (default 13 7 * * *) starts a
    # runner: the job below is skipped for every other entry, which costs no Actions minutes. The
    # site sets RUN_CRON from Settings, Schedule. RUN_CRON_WEEKLY (an entry of the same form, set by
    # hand) also starts a runner, so the weekly pass can have its own hour; the engine's gate checks
    # the weekly day.
    - cron: "13 0 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 1 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 2 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 3 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 4 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 5 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 6 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 7 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 8 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 9 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 10 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 11 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 12 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 13 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 14 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 15 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 16 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 17 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 18 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 19 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 20 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 21 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 22 * * *"
      timezone: "Europe/Stockholm"
    - cron: "13 23 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled, on-demand or weekly"
        type: choice
        options: [on-demand, scheduled, weekly]
        default: on-demand
      force:
        description: "Ignore the every-second-day gate"
        type: boolean
        default: false
      since:
        description: "Fetch window start (ISO date or time), optional"
        type: string
        default: ""
      feedback:
        description: "Regenerate: what the writer should improve, up to 500 characters, optional"
        type: string
        default: ""
      topics:
        description: "Regenerate: comma-separated topic ids for this run only, optional"
        type: string
        default: ""
      replace:
        description: "Regenerate a briefing: the digest id it replaces (same date, kind and window start), optional"
        type: string
        default: ""
      delete:
        description: "Delete a briefing: the digest id to remove with its narration timeline, optional"
        type: string
        default: ""
      dry_run:
        description: "Run every stage but write nothing and push nothing"
        type: boolean
        default: false

# One run at a time. GitHub keeps a single pending run, so duplicate presses collapse. An hourly
# trigger that is not the chosen hour gets a group of its own: it does nothing, and it must not take
# the single pending place from a real run.
concurrency:
  group: ${{ (github.event_name == 'schedule' && github.event.schedule != (vars.RUN_CRON || '13 7 * * *') && github.event.schedule != vars.RUN_CRON_WEEKLY) && format('singularity-skipped-{0}', github.run_id) || 'singularity' }}
  cancel-in-progress: false

# Every step that calls a model can reach Claude and Gemini (config/models.json): a secret is only
# visible to a step that is given it, so it is given once here.
env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

jobs:
  run:
    if: github.event_name != 'schedule' || github.event.schedule == (vars.RUN_CRON || '13 7 * * *') || github.event.schedule == vars.RUN_CRON_WEEKLY
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      outcome: ${{ steps.commit.outputs.outcome }}
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the engine's packages: the site's (Astro, React, Playwright) are not needed to run it, and
      # leaving them out takes the install from about 10 seconds to about 4.
      - name: Install
        id: install
        run: npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root

      # Delete runs alone: no stage after it has a plan to follow, so every later step is skipped.
      - name: Delete
        if: inputs.delete != ''
        shell: bash
        env:
          DELETE_ID: ${{ inputs.delete }}
          SINGULARITY_GIT_NAME: ${{ vars.SINGULARITY_GIT_NAME || vars.DISPATCH_GIT_NAME }}
          SINGULARITY_GIT_EMAIL: ${{ vars.SINGULARITY_GIT_EMAIL || vars.DISPATCH_GIT_EMAIL }}
        run: npm run --silent singularity -- run --delete "$DELETE_ID" --json

      - name: Gate
        id: gate
        if: inputs.delete == ''
        # Explicit bash enables pipefail, so a failing stage is not hidden by the tee in the pipe.
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'scheduled' }}
          FORCE: ${{ inputs.force }}
          SINCE: ${{ inputs.since }}
          REPLACE: ${{ inputs.replace }}
          DRY: ${{ inputs.dry_run }}
          # The config store (D149): with the switch on, the gate copies the stored config over
          # config/ before the run reads it. Either one unset leaves the run on the committed files.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SINGULARITY_CONFIG_STORE: ${{ vars.SINGULARITY_CONFIG_STORE || vars.DISPATCH_CONFIG_STORE }}
        run: |
          args=(--mode "$MODE" --json)
          [ "$FORCE" = "true" ] && args+=(--force)
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$REPLACE" ] && args+=(--replace "$REPLACE")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          npm run --silent singularity -- run --stage gate "${args[@]}" | tee "$RUNNER_TEMP/gate.json"
          echo "due=$(jq -r '.due' "$RUNNER_TEMP/gate.json")" >> "$GITHUB_OUTPUT"

      - name: Fetch
        if: steps.gate.outputs.due == 'true'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm run --silent singularity -- run --stage fetch --json

      - name: Judge
        if: steps.gate.outputs.due == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run --silent singularity -- run --stage judge --json

      - name: Write
        if: steps.gate.outputs.due == 'true'
        env:
          # The write stage checks each summary against its source with Jev and rewrites once.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Typed text from the site: passed as data in the environment, never spliced into the script.
          FEEDBACK: ${{ inputs.feedback }}
          TOPICS: ${{ inputs.topics }}
        run: npm run --silent singularity -- run --stage write --feedback "$FEEDBACK" --topics "$TOPICS" --json

      - name: Validate
        if: steps.gate.outputs.due == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # A briefing that validation cut short is refilled once, and the refill reads its
          # stories' pages the way the write stage does.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm run --silent singularity -- run --stage validate --json

      # Every story each pass considered (pool, judgments, selection), kept 30 days, so loop/replay.ts
      # can rebuild a briefing exactly, and why each written story did or did not air (written.json,
      # validate-report.json). The committed digest keeps only what published.
      - name: Keep the story pool
        if: always() && steps.gate.outputs.due == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-pool-${{ github.run_id }}
          path: |
            .cache/run/plan.json
            .cache/run/**/pool.json
            .cache/run/**/judged.json
            .cache/run/**/general.json
            .cache/run/**/general-judged.json
            .cache/run/**/selection.json
            .cache/run/**/written.json
            .cache/run/**/validate-report.json
          retention-days: 30
          if-no-files-found: ignore

      # Commit records the outcome (published, nothing, gated, failed) in state/last-run.json
      # before the run concludes. Published, nothing and gated all end as a successful run.
      - name: Commit
        id: commit
        if: inputs.delete == ''
        shell: bash
        # Vercel Hobby deploys only commits authored by the team owner, so commit as the owner.
        env:
          SINGULARITY_GIT_NAME: ${{ vars.SINGULARITY_GIT_NAME || vars.DISPATCH_GIT_NAME }}
          SINGULARITY_GIT_EMAIL: ${{ vars.SINGULARITY_GIT_EMAIL || vars.DISPATCH_GIT_EMAIL }}
        run: |
          npm run --silent singularity -- run --stage commit --json | tee "$RUNNER_TEMP/commit.json"
          echo "outcome=$(jq -r '.outcome' "$RUNNER_TEMP/commit.json")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(jq -r '.deploy' "$RUNNER_TEMP/commit.json")" >> "$GITHUB_OUTPUT"

      # A job that failed before Commit (an install, a crash) recorded no outcome, so health read the
      # run before it. This records `failed` for what the run was due to make, through the write
      # guard, so the next health check reports run_failed and heals once. The engine records
      # nothing for an on-demand run, a run that was not due or one Commit already committed. A
      # timeout is a cancel, which skips this step (health warns run_cancelled).
      - name: Record failure
        if: failure() && inputs.delete == '' && inputs.replace == '' && inputs.dry_run != true
        shell: bash
        env:
          INSTALLED: ${{ steps.install.outcome }}
          MODE: ${{ inputs.mode || 'scheduled' }}
          FORCE: ${{ inputs.force }}
          SINGULARITY_GIT_NAME: ${{ vars.SINGULARITY_GIT_NAME || vars.DISPATCH_GIT_NAME }}
          SINGULARITY_GIT_EMAIL: ${{ vars.SINGULARITY_GIT_EMAIL || vars.DISPATCH_GIT_EMAIL }}
        run: |
          [ "$INSTALLED" = "success" ] || npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root
          args=(--mode "$MODE" --json)
          [ "$FORCE" = "true" ] && args+=(--force)
          npm run --silent singularity -- run --record-failed "${args[@]}"

  # Vercel deploys the text digest from the Commit push. This job adds narration afterwards; its
  # own push triggers a second Vercel deploy that carries the audio.
  audio:
    needs: run
    # After a published digest, or when any digest still lacks audio (the retry path). The output
    # keeps its name, `deploy`, but now means "audio follow-up needed".
    if: needs.run.outputs.deploy == 'true'
    uses: ./.github/workflows/audio.yml
    secrets: inherit
