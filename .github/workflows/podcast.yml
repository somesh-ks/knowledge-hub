name: podcast

# Writes one episode of Singularity on request and commits it under Podcasts/. This commit does not
# deploy the site: vercel.json's ignoreCommand skips a push that touches no app code (D199), and
# content.yml mirrors the episode into the content store the pages read. The commit still uses the
# owner's identity from DISPATCH_GIT_NAME and DISPATCH_GIT_EMAIL, exactly as run.yml does.

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Request JSON: {"topic_ids":["ai"],"length_minutes":5,"format":"readout","window_days":7,"tone":"neutral"}'
        type: string
        required: true

# What the run list shows for each run, so the site can tell a new Catch up from a regeneration or a
# delete (D213): the request carries `action` and `id` for the last two and neither for a new episode.
run-name: ${{ fromJSON(inputs.request).action && format('{0} {1}', fromJSON(inputs.request).action, fromJSON(inputs.request).id) || 'episode' }}

# The same group as run.yml, so an episode and a digest never push at the same moment. GitHub keeps
# one pending run per group, so a request made while a digest is running waits for it to finish.
concurrency:
  # Its own group: sharing the run's group would let an episode request replace a queued briefing.
  # The push rebases and retries, so the two can overlap.
  group: singularity-podcast
  cancel-in-progress: false

# Every step that calls a model can reach Claude and Gemini (config/models.json): a secret is only
# visible to a step that is given it, so it is given once here.
env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Given to every stage's step, so each reads the same request and config.
    env:
      REQUEST: ${{ inputs.request }}
      # Where each stage's result is mirrored (podcast-runs/ in Blob, for a resume) and where the
      # live copy of the script goes (streams/), so the site can play the opening while the rest is
      # written. Without it the episode is made as before, with no copy and no resume.
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      SINGULARITY_GIT_NAME: ${{ vars.SINGULARITY_GIT_NAME || vars.DISPATCH_GIT_NAME }}
      SINGULARITY_GIT_EMAIL: ${{ vars.SINGULARITY_GIT_EMAIL || vars.DISPATCH_GIT_EMAIL }}
      # The config store (D149), as in run.yml's Gate step: the episode reads the topics the app
      # saved, not a run-old copy. Either one unset leaves it on the committed files.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SINGULARITY_CONFIG_STORE: ${{ vars.SINGULARITY_CONFIG_STORE || vars.DISPATCH_CONFIG_STORE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the engine's packages: the site's (Astro, React, Playwright) are not needed to run it, and
      # leaving them out takes the install from about 10 seconds to about 4.
      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root

      # No ffmpeg here: nothing in this job transcodes. The voices are recorded, and their Opus copy
      # made, in the audio job below, which installs ffmpeg for itself (audio.yml). This step cost 17
      # seconds before the first stage of every Catch up.

      # One step per stage, named as the page shows them (apps/web/src/lib/runStages.ts: the status
      # route reads the running step's name). Each saves its result in $RUNNER_TEMP and in Blob, and
      # skips itself when that result exists: a rerun with "resume_from": <failed run id> in the
      # request starts where the failed one stopped. The request reaches the command through
      # an environment variable and is expanded inside double quotes, so its text is never parsed as
      # shell. The command validates it again.
      - name: Gathering stories
        shell: bash
        run: npm run --silent singularity -- podcast --request "$REQUEST" --stage select --artifacts "$RUNNER_TEMP/podcast-stages"

      - name: Writing the script
        shell: bash
        run: npm run --silent singularity -- podcast --request "$REQUEST" --stage script --artifacts "$RUNNER_TEMP/podcast-stages"

      # The cover is chosen from the selection alone and is saved by the first step already, so it
      # never waits on the script; this step only makes it if a resume finds it missing.
      - name: Cover art
        shell: bash
        run: npm run --silent singularity -- podcast --request "$REQUEST" --stage cover --artifacts "$RUNNER_TEMP/podcast-stages"

      # Writes the episode file, commits it with the stage timings and pushes. The voices follow in
      # the audio job below, whose step is named "Recording voices" through audio.yml's step_name.
      - name: Publishing
        shell: bash
        run: npm run --silent singularity -- podcast --request "$REQUEST" --stage publish --artifacts "$RUNNER_TEMP/podcast-stages"

  # Narrates the new episode turn by turn into the files the site plays from, so its first Play
  # starts from stored audio. A separate job: the episode is already committed, so a failure here
  # never undoes it, and the next audio run (or Play) narrates what is missing.
  audio:
    needs: podcast
    uses: ./.github/workflows/audio.yml
    with:
      # The page names this stage by the step's name (apps/web/src/lib/runStages.ts).
      step_name: Recording voices
    secrets: inherit
