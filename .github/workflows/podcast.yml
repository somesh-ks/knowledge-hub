name: podcast

# Writes one episode of Singularity on request and commits it under Podcasts/. The site is deployed
# by the Vercel GitHub integration on every push to main. Vercel Hobby only deploys commits authored
# by the team owner, so the commit uses the owner's identity from DISPATCH_GIT_NAME and
# DISPATCH_GIT_EMAIL, exactly as run.yml does.

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Request JSON: {"topic_ids":["ai"],"length_minutes":5,"format":"readout","window_days":7,"tone":"neutral"}'
        type: string
        required: true

# The same group as run.yml, so an episode and a digest never push at the same moment. GitHub keeps
# one pending run per group, so a request made while a digest is running waits for it to finish.
concurrency:
  # Its own group: sharing the run's group would let an episode request replace a queued briefing.
  # The push rebases and retries, so the two can overlap.
  group: dispatch-podcast
  cancel-in-progress: false

# Every step that calls a model can reach Claude and Gemini (config/models.json): a secret is only
# visible to a step that is given it, so it is given once here.
env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the engine's packages: the site's (Astro, React, Playwright) are not needed to run it, and
      # leaving them out takes the install from about 10 seconds to about 4.
      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root

      # The request reaches the command through an environment variable and is expanded inside
      # double quotes, so its text is never parsed as shell. The command validates it again.
      - name: Podcast
        shell: bash
        env:
          REQUEST: ${{ inputs.request }}
          # The live copy of the script (streams/ in Blob), so the site can play the opening while the
          # rest is written. Without it the episode is made as before and there is no live copy.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DISPATCH_GIT_NAME: ${{ vars.DISPATCH_GIT_NAME }}
          DISPATCH_GIT_EMAIL: ${{ vars.DISPATCH_GIT_EMAIL }}
          # The config store (D149), as in run.yml's Gate step: the episode reads the topics the app
          # saved, not a run-old copy. Either one unset leaves it on the committed files.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISPATCH_CONFIG_STORE: ${{ vars.DISPATCH_CONFIG_STORE }}
        run: npm run --silent dispatch -- podcast --request "$REQUEST"

  # Narrates the new episode turn by turn into the files the site plays from, so its first Play
  # starts from stored audio. A separate job: the episode is already committed, so a failure here
  # never undoes it, and the next audio run (or Play) narrates what is missing.
  audio:
    needs: podcast
    uses: ./.github/workflows/audio.yml
    secrets: inherit
