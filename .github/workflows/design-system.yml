name: design-system

# The design system changes only in pull requests of its own (owner, 2026-10-29). This runs for a
# pull request that touches the system and checks the two halves of the rule: it carries the
# design-system label, and a pull request with the label holds nothing but the system, the app
# code that calls it, the guide and the docs. It reads the diff and the labels only, so it installs
# nothing and bills about a minute (D148). Re-run when a label is added or removed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - apps/web/src/design-system/**
      - apps/web/src/styles/buttons.css
      - apps/web/src/styles/icon.css
      - apps/web/src/styles/badge.css
      - apps/web/src/styles/switch.css
      - apps/web/src/styles/slider.css
      - apps/web/src/styles/avatar.css
      - apps/web/src/styles/row-exit.css
      - apps/web/src/styles/field.css
      - apps/web/src/styles/select.css
      - apps/web/src/styles/picker.css
      - apps/web/src/styles/wheel.css
      - apps/web/src/styles/ripple.css
      - apps/web/src/styles/menu.css
      - apps/web/src/styles/banner.css
      - apps/web/src/styles/dialog.css
      - apps/web/src/styles/sheet.css
      - apps/web/src/styles/drawer.css
      - apps/web/src/styles/primitives.css
      - apps/web/src/styles/foundations.css
      - apps/web/src/styles/tokens.css
      - tokens/**
      - apps/design/**
      - scripts/system/**
      - scripts/colorRamp.ts
      - .github/CODEOWNERS
      - .claude/skills/feature/references/controls-guide.md

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Adding the label needs write access to the pull request, and nothing else here does.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # A pull request opens without a label, so the first run used to fail on "needs the label" (6 of
      # the 26 red runs on 2026-11-03). This job runs only when the diff touches the system (the
      # `paths` filter), so the label goes on at open; the scope check below still rejects a mixed pull
      # request. A label later removed by hand is not put back: only `opened` and `reopened` add it.
      - name: Label at open
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label design-system
      - name: Label and scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # A label added with GITHUB_TOKEN starts no new run, so the step above hands it over here.
          LABELS: ${{ (github.event.action == 'opened' || github.event.action == 'reopened') && '["design-system"]' || toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/designSystemGate.mjs
