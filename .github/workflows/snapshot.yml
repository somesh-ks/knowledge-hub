name: snapshot

# A weekly copy of the config store into the config_snapshots table of the same database (D300). The
# owner's config is in no git history any more (D296), so this is the copy that outlives Neon's own
# restore window. `config snapshot` keeps the newest eight and refuses an empty store, so a broken
# connection never replaces a good copy. Restore with `config restore --latest --force`.

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root

      - name: Snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SINGULARITY_CONFIG_STORE: postgres
        run: npm run --silent singularity -- config snapshot
