name: Claude Code Review

# Opt-in review: runs only when the `review` label is added to a pull request.
# automerge.yml skips PRs that carry this label, so a labeled PR waits for a human
# merge and the review lands before it. Label the PR when you open it; if ci passes
# first, automerge may already have merged it. Remove and re-add the label to re-review.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only (fork PRs get no secrets), no drafts, no Dependabot.
    if: >-
      github.event.label.name == 'review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      # anthropics/claude-code-action v1
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The plugin reads the pull request with gh before it reviews; without these the run
          # ends after a few denied calls and posts nothing, yet still reports success.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
