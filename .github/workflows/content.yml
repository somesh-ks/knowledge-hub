name: content

# Tells the browsers waiting on a Catch up or a regeneration that its run has ended (D284), after
# each workflow that makes content. It no longer copies anything: digests and episodes go to the
# content store from the job that made them (the Save content step, D300), and git does not hold them.
# It also empties the edge copy of the pages (D318). The name stays: health.yml reads this workflow's
# runs as the notifier's history.

on:
  workflow_run:
    workflows: [run, podcast, audio, config]
    types: [completed]
  workflow_dispatch:

# One at a time; a queued one covers every run it waited behind.
concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --workspace=apps/web --include-workspace-root

      # D318: the pages keep their edge copy until the content changes, so a run that saved content
      # empties it. After the function instances' 30 s manifest window (MANIFEST_TTL_MS in apps/web)
      # plus the longest a render may run (20 s, FUNCTION_MAX_DURATION_S), so no request puts the old
      # page back, and before Notify, so a tap on the message opens the new page. The config workflow
      # saves no pages. A run that saved nothing costs one slow visit. A failed purge never fails the
      # job: the pages then refresh on the first visit after 5 minutes.
      # The Vercel token stays in this step, out of reach of the packages the engine loads (SEC-03).
      - name: Purge the edge
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name != 'config'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sleep 55
          mkdir -p "$RUNNER_TEMP/vercel"
          cd "$RUNNER_TEMP/vercel"
          npx --yes vercel@65.8.0 cache dangerously-delete --tag content \
            --project knowledge-hub --scope somesh-ks-projects --yes --token "$VERCEL_TOKEN" \
            || echo "::warning::edge purge failed; pages refresh on the first visit after 5 minutes"

      # D284: tell the browsers waiting on a Catch up or a regeneration that has just ended. The job
      # that made the episode has saved it to the store before this runs. A message that fails is
      # tried again at the next run. The signing keys are made by the site and kept in Neon.
      - name: Notify
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run --silent singularity -- push notify
