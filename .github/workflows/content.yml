name: content

# Mirrors the site's content (Digests/, Podcasts/, the run state) into the content store in Vercel
# Blob after every workflow that commits it (D173). The pages read the store; git stays the backup.
# `singularity content sync` sends only what changed and is safe to run again, so a failed or skipped
# sync is finished by the next one. Run it by hand to fill the store. Covers are not stored: the site
# draws a cover the build lacks when it is asked for (D256).
#
# workflow_run for the engine: it pushes with the Actions token, and GitHub starts no workflow for a
# push made with it. push for everything else that changes content on main, such as a merged PR
# (2026-10-27: an Opus backfill merged by PR never reached the store until a manual sync).

on:
  workflow_run:
    workflows: [run, podcast, audio, config]
    types: [completed]
  push:
    branches: [main]
    paths: ["Digests/**", "Podcasts/**"]
  workflow_dispatch:

# One sync at a time; a queued one reads the newest main, so it covers every sync it waited behind.
concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --workspace=apps/web --include-workspace-root

      - name: Sync
        id: sync
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm run --silent singularity -- content sync | tee "$RUNNER_TEMP/sync.txt"
          # A sync that sent nothing leaves the edge alone: a purge makes the next visit wait.
          if grep -q "^Content store: 0 uploaded, 0 deleted" "$RUNNER_TEMP/sync.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # D318: the pages keep their edge copy until the content changes, so a sync empties it. After
      # the function instances' 30 s manifest window (MANIFEST_TTL_MS in apps/web), so no instance
      # puts the old page back, and before Notify, so a tap on the message opens the new page. A
      # failed purge never fails the sync: the pages then refresh on the first visit after 5 minutes.
      # The Vercel token stays in this step, out of reach of the packages the engine loads (SEC-03).
      - name: Purge the edge
        if: steps.sync.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sleep 35
          mkdir -p "$RUNNER_TEMP/vercel"
          cd "$RUNNER_TEMP/vercel"
          npx --yes vercel@65.8.0 cache dangerously-delete --tag content \
            --project knowledge-hub --scope somesh-ks-projects --yes --token "$VERCEL_TOKEN" \
            || echo "::warning::edge purge failed; pages refresh on the first visit after 5 minutes"

      # D284: tell the browsers waiting on a Catch up or a regeneration that has just ended. After the
      # sync, so the episode is in the store when the tap lands. A message that fails is tried again
      # at the next sync, and nothing here may fail the sync. The signing keys are made by the site and kept in Neon.
      - name: Notify
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run --silent singularity -- push notify
