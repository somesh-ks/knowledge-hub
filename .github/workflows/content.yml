name: content

# Tells the browsers waiting on a Catch up or a regeneration that its run has ended (D284), after
# each workflow that makes content. It no longer copies anything: digests and episodes go to the
# content store from the job that made them (the Save content step, D300), and git does not hold them.
# The name stays: health.yml reads this workflow's runs as the notifier's history.

on:
  workflow_run:
    workflows: [run, podcast, audio, config]
    types: [completed]
  workflow_dispatch:

# One at a time; a queued one covers every run it waited behind.
concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --workspace=apps/web --include-workspace-root

      # D284: tell the browsers waiting on a Catch up or a regeneration that has just ended. The job
      # that made the episode has saved it to the store before this runs. A message that fails is
      # tried again at the next run. The signing keys are made by the site and kept in Neon.
      - name: Notify
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run --silent singularity -- push notify
