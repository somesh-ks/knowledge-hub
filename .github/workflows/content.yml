name: content

# Tells the browsers waiting on a Catch up or a regeneration that its run has ended (D284), after
# each workflow that makes content. It no longer copies anything: digests and episodes go to the
# content store from the job that made them (the Save content step, D300), and git does not hold them.
# It also empties the edge copy of the pages (D318). The name stays: health.yml reads this workflow's
# runs as the notifier's history.

on:
  workflow_run:
    workflows: [run, podcast, audio, config]
    types: [completed]
  workflow_dispatch:

# One at a time; a queued one covers every run it waited behind.
concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: read
  # The Purge step reads the triggering run's jobs to find when its content was saved.
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --workspace=apps/web --include-workspace-root

      # D318: the pages keep their edge copy until the content changes, so a run that saved content
      # empties it. The purge comes WAIT_SECONDS after the last Save content step of the run: the
      # function instances' 30 s manifest window (MANIFEST_TTL_MS in apps/web) plus the longest a
      # render may run (20 s, FUNCTION_MAX_DURATION_S), so no request puts the old page back. The
      # wait counts from that save, not from this job's start: the job teardown, the queue and the
      # install above already used most of it. With no save to find (the config workflow, a hand
      # run) it counts from the end of the run, and a hand run waits all of it. Before Notify, so a
      # tap on the message opens the new page. The config workflow saves no pages. A run that saved
      # nothing costs one slow visit. A failed purge never fails the job: the pages then refresh on
      # the first visit after 5 minutes.
      # The Vercel token stays in this step, out of reach of the packages the engine loads (SEC-03).
      - name: Purge the edge
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name != 'config'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ENDED: ${{ github.event.workflow_run.updated_at }}
          WAIT_SECONDS: 55
        run: |
          saved=""
          if [ -n "$RUN_ID" ]; then
            saved=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[].steps[]? | select(.name == "Save content") | .completed_at // empty] | max // empty' \
              2>/dev/null) || saved=""
            [ -n "$saved" ] || saved="$RUN_ENDED"
          fi
          wait="$WAIT_SECONDS"
          if [ -n "$saved" ] && saved_at=$(date -u -d "$saved" +%s 2>/dev/null); then
            age=$(( $(date -u +%s) - saved_at ))
            if [ "$age" -lt 0 ]; then age=0; fi
            wait=$(( WAIT_SECONDS - age ))
          fi
          if [ "$wait" -gt 0 ]; then
            echo "Last save $saved; waiting $wait s"
            sleep "$wait"
          fi
          mkdir -p "$RUNNER_TEMP/vercel"
          cd "$RUNNER_TEMP/vercel"
          npx --yes vercel@65.8.0 cache dangerously-delete --tag content \
            --project knowledge-hub --scope somesh-ks-projects --yes --token "$VERCEL_TOKEN" \
            || echo "::warning::edge purge failed; pages refresh on the first visit after 5 minutes"

      # D284: tell the browsers waiting on a Catch up or a regeneration that has just ended. The job
      # that made the episode has saved it to the store before this runs. A message that fails is
      # tried again at the next run. The signing keys are made by the site and kept in Neon.
      - name: Notify
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run --silent singularity -- push notify
