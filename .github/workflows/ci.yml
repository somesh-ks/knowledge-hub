name: ci

# Pull requests only: every change reaches main through one, and a run per push to main checked the
# same code again and ran for every digest commit. Actions minutes on a private repository are
# capped, and the cap stopped every workflow on 2026-10-22 (D148).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, so a run bills the fewest whole minutes (each job rounds up on its own, D148).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gitleaks lists the pull request's commits, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      shared: ${{ steps.diff.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Digest, state and docs commits skip the heavy checks.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "shared=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # An unreachable base (a force-push) must run every check, never skip them.
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "shared=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The tokens and the shared stylesheets carry most of the load-bearing design fixes.
          if printf '%s\n' "$changed" | grep -qE '^(tokens/|apps/web/src/styles/(player|primitives|buttons)\.css$)'; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=false" >> "$GITHUB_OUTPUT"
          fi
          # The browser suites are the only checks that see CSS and layout: any change the site is
          # built from may need them: the site, packages, tokens, build scripts, lockfile and workflows.
          if printf '%s\n' "$changed" | grep -qE '^(apps/web/|packages/|tokens/|scripts/build|package(-lock)?\.json$|tsconfig|\.nvmrc$|\.github/workflows/(ci|browser)\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # config/*.json is validated by the test suite, so only the hand-written notes skip it.
          if printf '%s\n' "$changed" | grep -qvE '^(Digests/|state/|docs/|config/sources\.md$|$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # What ships, read from the lockfile (no install). A high or critical advisory fails the
      # check; path-to-regexp under @astrojs/vercel is held at a patched 6.x by the root
      # `overrides` (docs/engineering/hardening.md). The registry's audit service being down (a 503 on
      # 2026-10-22, seven minutes then a failure) is not a finding: it warns and the check passes.
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          out=$(timeout 150 npm audit --omit=dev --audit-level=high --json 2>/dev/null)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if ! jq -e '.metadata.vulnerabilities' >/dev/null 2>&1 <<<"$out"; then
            # Only the service being away (a hang, a 5xx, a network error) passes; a broken lockfile
            # or any other error fails, so the audit is never skipped in silence.
            if [ "$code" -eq 124 ] || grep -qiE '"code": *"(E5[0-9][0-9]|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN)"|Service Unavailable|Bad Gateway|Gateway Time' <<<"$out"; then
              echo "::warning::npm's audit service did not answer; dependencies were not audited this run"
              exit 0
            fi
            echo "npm audit failed: $out"
            exit 1
          fi
          # The advisories themselves, not every package the severity flows up to.
          jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | "\(.severity): \(.name): \(.title) \(.url)"] | unique[]' <<<"$out"
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.diff.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.diff.outputs.code == 'true'
        run: npm ci --ignore-scripts
      # The Opus transcode (packages/engine/src/audio/transcode.ts) needs ffmpeg with libopus, which
      # the runner image does not carry; without it audio-episodeOpus.test.ts skips.
      - name: ffmpeg
        if: steps.diff.outputs.code == 'true'
        run: |
          # Read in full first: under pipefail an early `grep -q` exit can fail ffmpeg with SIGPIPE.
          encoders="$(ffmpeg -hide_banner -encoders 2>/dev/null || true)"
          if ! grep -q libopus <<<"$encoders"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | sed -n 1p
      - name: Typecheck
        if: steps.diff.outputs.code == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.diff.outputs.code == 'true'
        run: npm run lint
      - name: Test
        if: steps.diff.outputs.code == 'true'
        run: npm test
      - name: Build site
        if: steps.diff.outputs.code == 'true'
        env:
          SINGULARITY_FIXTURES: "1"
        run: npm run build

  # A design fix (a sizer, a fixed width, a specificity bump) is invisible to the checks above: a
  # change that undoes one passes typecheck, lint, unit tests and the build. Both browser suites
  # (browser.yml, which also runs on every push to main and nightly) run for any change the site
  # is built from. They used to run only for the tokens, a shared stylesheet, Dependabot or a
  # `browser` label, so the service worker and BaseLayout change in #346 skipped them and a
  # regression reached main (2026-10-26, D148).
  # After check: a run that fails it is blocked anyway, and the suites would only spend minutes.
  browser:
    needs: check
    if: needs.check.outputs.web == 'true'
    uses: ./.github/workflows/browser.yml
