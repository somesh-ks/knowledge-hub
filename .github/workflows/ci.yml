name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Digest, state and docs commits skip the heavy checks.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # An unreachable base (a force-push) must run every check, never skip them.
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The browser suites are the only checks that see CSS and layout: they run for any
          # change the site is built from.
          if printf '%s\n' "$changed" | grep -qE '^(apps/web/|packages/|tokens/|package(-lock)?\.json$|tsconfig)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # config/*.json is validated by the test suite, so only the hand-written notes skip it.
          if printf '%s\n' "$changed" | grep -qvE '^(Digests/|state/|docs/|config/sources\.md$|$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build site
        env:
          DISPATCH_FIXTURES: "1"
        run: npm run build

  # A design fix (a sizer, a fixed width, a specificity bump) is invisible to the checks above: a
  # change that undoes one passes typecheck, lint, unit tests and the build. Both browser suites
  # run here so it fails before it merges (AGENTS.md, 2026-10-18).
  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: "4501"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Player suite
        run: npm run e2e:player -w @dispatch/web
      - name: Site suite
        if: ${{ !cancelled() }}
        run: npm run e2e -w @dispatch/web
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists the pull request's commits, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
