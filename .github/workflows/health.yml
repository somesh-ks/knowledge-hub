name: health

# Once a day, `singularity health` checks the last runs, narration, the digests and state, the cost
# ledger and the live site (docs/engineering/hardening.md). A fault opens one issue labelled
# `health`, or updates it; a green run closes it. When a fault first appears (no open issue yet) it
# heals once: a failed or missed briefing starts one scheduled run, missing narration starts one
# audio run. GitHub's own run list is the record that a run started: one that failed with no
# outcome in state/last-run.json after it is `run_died` and one cancelled is the warning
# `run_cancelled`; both only alert (a missed briefing also reads as `run_overdue`, which heals).
# While the issue stays open nothing is retried again, so a fault never loops. Performance is a
# lab probe on Mondays (D147): cold loads of three pages on a throttled phone, judged as warnings
# only; and, daily, the field Web Vitals real visits stored in Neon (D156): a 7-day p75 past
# "needs improvement" warns, past "poor" it is a fault, which opens the issue (nothing heals it).
# Warnings open no `health` issue: on Mondays one issue labelled `health-warnings` lists the
# standing ones (closed when there are none), and a daily comment on an open `health` issue leads
# with the faults the last report did not list.
#
# A drill (Run workflow, drill ticked) proves the healing path on the real repository without a
# real fault: on a copy of the report with the real findings taken out it plants `run_overdue`,
# opens an issue of its own (labelled `health-drill`), starts one scheduled run as a dry run (it
# stops at the gate and writes nothing), then closes that issue. It never reads or touches the
# `health` issue, so a real fault open for days does not hold it back. It is refused while a
# run.yml run is queued or running and whenever run.yml's own gate would let a scheduled run work
# today (a briefing or the weekly pass due), since that dry run would pay for models.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Plant a fault and prove the healing path (a dry run, then the issue closes)"
        type: boolean
        default: false

# A drill touches no `health` issue, so it queues apart: a drill dispatched behind another never
# takes the daily check's single pending place.
concurrency:
  group: ${{ inputs.drill && 'health-drill' || 'health' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # `site_behind` finds the newest commit vercel.json's ignoreCommand watches and asks
          # whether the live build holds it: both need history, not one commit.
          fetch-depth: 100

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The probe costs several minutes of a capped allowance (D148), so it runs on Mondays and on a
      # manual run; the other days health judges no performance. A drill drops the real findings,
      # so it never probes.
      - name: Probe today?
        id: probe
        shell: bash
        run: |
          if [ "${{ inputs.drill }}" != "true" ] && { [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        # apps/web brings Playwright, which only the probe needs.
        run: >-
          npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root
          ${{ steps.probe.outputs.run == 'true' && '--workspace=apps/web' || '' }}

      # The lab probe (D147, scripts/perfProbe.ts). One that fails (the site down, a timeout) writes
      # no perf.json and never fails the job: health reads the missing file as `perf_unmeasured`.
      - name: Probe performance
        if: steps.probe.outputs.run == 'true'
        shell: bash
        continue-on-error: true
        # Nine throttled loads of up to 65 s each, after the browser install, with room to spare.
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          npx tsx scripts/perfProbe.ts https://news.someshks.work --out "$RUNNER_TEMP/perf.json"

      - name: Check
        shell: bash
        env:
          SPEECHIFY_MONTHLY_CHARS: ${{ vars.SPEECHIFY_MONTHLY_CHARS }}
          SPEECHIFY_VOICE_ID: ${{ vars.SPEECHIFY_VOICE_ID }}
          SPEECHIFY_VOICE_ID_B: ${{ vars.SPEECHIFY_VOICE_ID_B }}
          CEILING: ${{ vars.SINGULARITY_DAILY_USD_CEILING || vars.DISPATCH_DAILY_USD_CEILING || '5' }}
          # The Neon store: field Web Vitals (D156) and the site's shared rate counter. Unset, health
          # warns field_unmeasured; set and failing, it warns store_degraded.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Vercel's deployment count against Hobby's 100 a day (D247). Unset, the check is skipped.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The config store switch (D149): on, health compares the stored documents with git.
          SINGULARITY_CONFIG_STORE: ${{ vars.SINGULARITY_CONFIG_STORE || vars.DISPATCH_CONFIG_STORE }}
          # Empty on a day without the probe, which health reads as nothing to judge.
          PERF: ${{ steps.probe.outputs.run == 'true' && format('{0}/perf.json', runner.temp) || '' }}
        run: |
          # GitHub runs bash with -e: health exits 1 on a fault, which ended the step before the
          # report was read, so Report and heal was skipped on every real fault (the 2026-10-22
          # drill found it). The exit code is printed and the report decides.
          set +e
          set -uo pipefail
          runs="$RUNNER_TEMP/runs.json"
          # run.yml starts every hour, so its last 3 days (RUN_DIED_WINDOW_MS) are about 72 runs.
          since=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --workflow run.yml --created ">=$since" --limit 200 --json databaseId,status,conclusion,createdAt,event,displayTitle > "$runs" || echo '[]' > "$runs"
          # The other workflows whose failure leaves the site stale or a podcast missing (OBS-01).
          for wf in content ingest podcast; do
            gh run list --workflow "$wf.yml" --created ">=$since" --limit 50 --json databaseId,status,conclusion,createdAt,event,displayTitle > "$RUNNER_TEMP/side-$wf.json" || echo '[]' > "$RUNNER_TEMP/side-$wf.json"
          done
          side="$RUNNER_TEMP/side-runs.json"
          jq -n --slurpfile c "$RUNNER_TEMP/side-content.json" --slurpfile i "$RUNNER_TEMP/side-ingest.json" --slurpfile p "$RUNNER_TEMP/side-podcast.json" '{content: $c[0], ingest: $i[0], podcast: $p[0]}' > "$side" || echo '{}' > "$side"
          npm run --silent singularity -- health --json --ceiling-usd "$CEILING" --runs "$runs" --side-runs "$side" --perf "$PERF" | tee "$RUNNER_TEMP/health.json" >/dev/null
          echo "exit=${PIPESTATUS[0]}"
          jq -r '.findings[] | "\(.severity) [\(.aspect)] \(.code): \(.message)"' "$RUNNER_TEMP/health.json" || true
          # Performance findings are mostly warnings, which open no issue (D147, D156), so they go on
          # the run's page, the field p75s with them.
          jq -r '.findings[] | select(.aspect == "performance") | "::warning title=\(.code)::\(.message)"' "$RUNNER_TEMP/health.json" || true
          jq -r '"## Performance", "", (.findings[] | select(.aspect == "performance") | "- \(.code): \(.message)"), (.passed[] | select(test("lab budget|^field ")) | "- \(.)")' "$RUNNER_TEMP/health.json" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report and heal
        shell: bash
        env:
          DRILL: ${{ inputs.drill == true }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/health.json"
          # A check that crashed is a fault of its own, reported like the others.
          jq -e '.findings' "$report" >/dev/null 2>&1 ||
            echo '{"ok":false,"findings":[{"severity":"fault","aspect":"reliability","code":"health_crashed","message":"singularity health did not finish; see the run log."}]}' > "$report"
          # run.yml runs queued or running.
          run_busy() { gh run list --workflow run.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length'; }
          label=health
          heal_args=()
          prefix=""
          if [ "$DRILL" = "true" ]; then
            # A drill is its own case: its own issue (label health-drill; it never reads the health
            # issue) and its own report, today's with the real findings taken out and run_overdue
            # planted, so a real fault neither holds it back nor changes what it tests. Its dry run
            # must stop at the gate: run.yml's gate is asked first, as its Gate step will ask it, and
            # a briefing or weekly pass due today (a run_failed or run_overdue makes one due) would
            # take the dry run past it and pay for models.
            refuse=""
            due=$(npm run --silent singularity -- run --stage gate --mode scheduled --dry-run --json | jq -r '.due') || due=""
            if [ "$due" = "true" ]; then
              refuse="run.yml's gate says a briefing or the weekly pass is due today, so its dry run would pay for model calls"
            elif [ "$due" != "false" ]; then
              refuse="run.yml's gate did not answer, so its dry run could pay for model calls"
            else
              busy=$(run_busy)
              [ "$busy" = "0" ] || refuse="a run.yml run is queued or running"
            fi
            if [ -n "$refuse" ]; then
              echo "::warning title=Drill refused::No drill: $refuse."
              exit 0
            fi
            jq '.ok = false | .findings = [{"severity":"fault","aspect":"reliability","code":"run_overdue","message":"Drill: a planted fault (health.yml, drill input). Nothing is wrong."}]' "$report" > "$RUNNER_TEMP/drill.json"
            report="$RUNNER_TEMP/drill.json"
            label=health-drill
            heal_args=(-f dry_run=true)
            prefix="Drill: "
            gh label create health-drill --color FBCA04 --description "health.yml drill: a planted fault, nothing is wrong" --force >/dev/null
            # A drill stopped between its create and its close (a cancel, an API error) left its
            # issue open; the next one closes it. Only drill issues are listed.
            for stale in $(gh issue list --label health-drill --state open --json number --jq '.[].number'); do
              gh issue close "$stale" --comment "Left open by an earlier drill; closed by the next one."
            done
            open_issue='{}'
          else
            gh label create health --color B60205 --description "Daily health check" --force >/dev/null
            open_issue=$(gh issue list --label health --state open --limit 1 --json number,title --jq '.[0] // empty')
            [ -n "$open_issue" ] || open_issue='{}'
          fi
          issue=$(jq -r '.number // empty' <<<"$open_issue")
          ok=$(jq -r '.ok' "$report")
          codes=$(jq -r '[.findings[] | select(.severity == "fault") | .code] | unique | join(" ")' "$report")
          # The open issue's title ends with the faults already healed ("| healed: ..."): each heals
          # once while it lasts. A fault that clears drops off the list, so a return heals again.
          title=$(jq -r '.title // ""' <<<"$open_issue")
          held=""
          [[ "$title" == *"| healed: "* ]] && held="${title##*| healed: }"
          new_fault() { [[ " $codes " == *" $1 "* && " $held " != *" $1 "* ]]; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Warnings open no `health` issue, so nobody saw them. On Mondays (the probe's day, D148)
          # one issue labelled health-warnings lists the standing ones, and closes when there are
          # none. It never heals and never touches the health issue; a drill skips it.
          warnings_issue() {
            # Called under `||`, so set -e is off in here: each call that decides what happens is
            # checked. A list that failed must not read as "no issue open" and open a second one.
            gh label create health-warnings --color FBCA04 --description "Standing health warnings, listed on Mondays" --force >/dev/null || return 1
            local open_warn warn_codes
            open_warn=$(gh issue list --label health-warnings --state open --limit 1 --json number --jq '.[0].number // empty') || return 1
            warn_codes=$(jq -r '[.findings[] | select(.severity == "warning") | .code] | unique | join(" ")' "$report")
            if [ -z "$warn_codes" ]; then
              [ -z "$open_warn" ] || gh issue close "$open_warn" --comment "No standing warnings on $(date -u +%F) ([run]($run_url))."
              return 0
            fi
            {
              echo "Standing warnings on $(date -u +%F) ([run]($run_url)). Nothing heals these; faults go to the \`health\` issue."
              echo
              jq -r '.findings[] | select(.severity == "warning") | "- [\(.aspect)] `\(.code)`: \(.message)"' "$report"
            } > "$RUNNER_TEMP/warnings.md"
            if [ -n "$open_warn" ]; then
              gh issue comment "$open_warn" --body-file "$RUNNER_TEMP/warnings.md"
              gh issue edit "$open_warn" --title "Health warnings: $warn_codes"
            else
              gh issue create --title "Health warnings: $warn_codes" --label health-warnings --body-file "$RUNNER_TEMP/warnings.md" >/dev/null
            fi
          }
          # A crashed check lists no warnings: that is not "none", so it leaves the issue as it is.
          if [ "$DRILL" != "true" ] && [ "$(date -u +%u)" = "1" ] &&
            ! jq -e '.findings | any(.code == "health_crashed")' "$report" >/dev/null; then
            warnings_issue || echo "::warning title=Warnings issue::The health-warnings issue could not be updated."
          fi

          if [ "$ok" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Green again on $(date -u +%F) ([run]($run_url))."
            fi
            exit 0
          fi

          healed=""
          just_healed=""
          # A fault heals once, when it first appears, even while the issue is open for another
          # (run_died alone never heals: it is alert only). A run already queued or running is left alone.
          busy=$(run_busy)
          if { new_fault run_failed || new_fault run_overdue; } && [ "$busy" = "0" ]; then
            if gh workflow run run.yml -f mode=scheduled "${heal_args[@]}"; then
              healed="${healed}- Started one scheduled run.\n"
              for code in run_failed run_overdue; do new_fault "$code" && just_healed="$just_healed $code"; done
            fi
          fi
          if new_fault audio_missing && gh workflow run audio.yml; then
            healed="${healed}- Started one audio run.\n"
            just_healed="$just_healed audio_missing"
          fi
          # Healed and still failing, or healed just now; a fault that cleared is forgotten.
          keep=""
          for code in $held $just_healed; do [[ " $codes " == *" $code "* ]] && keep="$keep $code"; done
          keep=$(printf '%s\n' $keep | sort -u | xargs)
          new_title="${prefix}Health: ${codes}${keep:+ | healed: $keep}"

          # On an issue already open, the faults the last report did not list lead, so a fault open
          # for weeks cannot hide a new one under the same daily comment.
          fresh=""
          if [ -n "$issue" ]; then
            # The last report this workflow wrote (the bot's comment, else the issue it opened), not
            # whoever commented last.
            last=$(gh issue view "$issue" --json body,comments --jq '([.comments[] | select(.author.login | test("^github-actions"))] | last | .body) // .body // ""') || last=""
            before=$(grep -oE '^- fault \[[a-z]+\] `[a-z_]+`' <<<"$last" | grep -oE '`[a-z_]+`' | tr -d '`' | xargs || true)
            for code in $codes; do [[ " $before " == *" $code "* ]] || fresh="$fresh \`$code\`"; done
          fi

          {
            echo "Health check on $(date -u +%F): **faults** ([run]($run_url))."
            echo
            if [ -n "$fresh" ]; then echo "**New since the last report:**$fresh."; echo; fi
            jq -r '.findings[] | "- \(.severity) [\(.aspect)] `\(.code)`: \(.message)"' "$report"
            if [ -n "$healed" ]; then echo; echo "Self-healing (once):"; printf "%b" "$healed"; fi
            echo
            echo "Reproduce with the engine's health command; see docs/engineering/hardening.md."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/body.md"
            gh issue edit "$issue" --title "$new_title"
          else
            issue=$(gh issue create --title "$new_title" --label "$label" --body-file "$RUNNER_TEMP/body.md" | grep -oE '[0-9]+$')
          fi
          # A drill leaves nothing open: its issue and the dry run it started are the proof. One
          # that could not start the dry run (a run.yml run started since the guard, a failed
          # dispatch) proved nothing.
          if [ "$DRILL" = "true" ]; then
            if [ -n "$healed" ]; then
              gh issue close "$issue" --comment "Drill finished: the planted fault opened this issue and started one dry run. ([run]($run_url))"
            else
              gh issue close "$issue" --comment "Drill failed: the planted fault opened this issue but no dry run started. ([run]($run_url))"
              echo "::error title=Drill failed::The healing path did not start a run (a run.yml run was busy or the dispatch failed)."
              exit 1
            fi
          fi
