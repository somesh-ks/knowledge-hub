name: episode-eval

# Scores the episode fixtures in loop/ against loop/rubric.md: Jev labels importance, the newest
# Sonnet scores quality. On a pull request it rewrites the latest replay with main's writer prompt
# and with the branch's, so a prompt change is judged before and after on the same stories.
# The keys exist only as repository secrets, so the eval with its judges runs here.
# Only on request: add the `eval` label to a pull request (re-add it to run again), or start it by
# hand. On every push to a writer, judge or loop change it ran 12 times on 2026-10-24, each about
# 40 Sonnet calls on the API key and none of them in the cost ledger (D180).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # Secrets reach pull requests from this repository only, never from a fork.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'eval' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rewrite the latest replay with main's writer prompt and this branch's
        if: github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git fetch --depth=1 origin main
          git show origin/main:packages/engine/src/write/prompt.ts > packages/engine/src/write/prompt.main.ts
          # main's prompt may import the packages by their name before D179; this branch only has the new one.
          sed -i 's#@dispatch/#@singularity/#g' packages/engine/src/write/prompt.main.ts
          git show origin/main:config/voice.md > "$RUNNER_TEMP/voice.main.md"
          latest=$(ls -d loop/results/replay-*/ | sort -V | tail -1)
          for kind in daily weekly; do
            npx tsx loop/rewrite.ts "${latest}replay-$kind" "rewrites/before-$kind" \
              --prompt packages/engine/src/write/prompt.main.ts --voice "$RUNNER_TEMP/voice.main.md"
            npx tsx loop/rewrite.ts "${latest}replay-$kind" "rewrites/after-$kind"
          done
      - name: Eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set +e
          : > eval.md
          status=0
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The writer before and after this branch's prompt, on the same stories. The fixtures and
            # earlier replays never change on a pull request, so judging them again bought nothing.
            episodes=(rewrites/*/)
          else
            npx tsx loop/eval.ts | tee eval.md
            status=${PIPESTATUS[0]}
            # Each loop iteration's replay of October's stories (loop/replay.ts), judged the same way.
            episodes=(loop/results/replay-*/replay-*/)
          fi
          for episode in "${episodes[@]}"; do
            [ -d "$episode" ] || continue
            npx tsx loop/eval.ts "${episode%/}" | tee -a eval.md
          done
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
          # The table is the result; a failing metric is a finding, not a broken build.
          echo "eval exit $status"
      - name: Show why the branch's episodes score what they do
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          for episode in rewrites/after-*/; do
            [ -d "$episode" ] && npx tsx loop/inspect.ts "${episode%/}" | tee -a inspect.md
          done
      - name: Keep the rewritten episodes for reading
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrites
          path: |
            rewrites/
            eval.md
            inspect.md
          if-no-files-found: ignore
          retention-days: 14
