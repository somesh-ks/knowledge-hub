name: audio

# Generates missing narration, uploads it to Vercel Blob and commits the timeline metadata.
# This commit does not deploy the site: vercel.json's ignoreCommand skips a push that touches no app
# code (D199), and content.yml mirrors the metadata into the content store the pages read. The commit
# uses the owner's identity from the SINGULARITY_GIT_NAME and SINGULARITY_GIT_EMAIL variables.

on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false
      BLOB_READ_WRITE_TOKEN:
        required: false
      SPEECHIFY_API_KEY:
        required: false
    inputs:
      # What the step is called, so an episode run can show it as "Recording voices". run.yml leaves
      # it out and its step keeps the name "Audio", which the status route reads.
      step_name:
        type: string
        default: Audio
      prune_now:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      # The prune lists all of audio/ and so runs on Sundays only; this runs it on any day.
      prune_now:
        description: Prune old audio now, whatever the day
        type: boolean
        default: false
  # Pruning must not wait for a publish: a seven-day cadence can skip every Sunday. Nothing is
  # narrated here unless something is pending, so a quiet week costs one Blob listing.
  schedule:
    - cron: "17 3 * * 0"

# A separate group from run.yml: a called workflow that shares its caller's group is cancelled.
concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The caller's SHA predates the digest commit, so always start from the tip of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the engine's packages: the site's (Astro, React, Playwright) are not needed to run it, and
      # leaving them out takes the install from about 10 seconds to about 4.
      - name: Install
        run: npm ci --ignore-scripts --workspace=packages/engine --include-workspace-root

      # Digests and episodes are in the content store, not in git (D300). Copy them in first: the job
      # reads them (the ids already taken, the audio still owed, the stories an episode draws on).
      # --track records what the store held, so Save content below sends back only what this job
      # changed. A job that cannot read the store stops here rather than run on an empty Digests/.
      - name: Load content
        id: content
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            npm run --silent singularity -- content pull --track || { sleep $((attempt * 10)); continue; }
            exit 0
          done
          exit 1

      # The Opus transcode (packages/engine/src/audio/transcode.ts) needs ffmpeg with libopus, which
      # the runner image does not carry: without it the Opus copy is skipped and the MP3 plays alone.
      - name: ffmpeg
        timeout-minutes: 5
        # A failed or stalled install must never cost the episode: the MP3 still publishes alone.
        continue-on-error: true
        run: |
          # Read in full first: under pipefail an early `grep -q` exit can fail ffmpeg with SIGPIPE.
          encoders="$(ffmpeg -hide_banner -encoders </dev/null 2>/dev/null || true)"
          if ! grep -q libopus <<<"$encoders"; then
            # The man-db trigger can take minutes after an install on the runner image, and apt
            # waits on a slow mirror unbounded: skip the one and bound the other. Not -qq, so a
            # stall shows its stage in the log.
            sudo rm -f /var/lib/man-db/auto-update
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo apt-get "${apt_opts[@]}" update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y -q --no-install-recommends ffmpeg
            encoders="$(ffmpeg -hide_banner -encoders </dev/null 2>/dev/null || true)"
          fi
          if ! grep -q libopus <<<"$encoders"; then
            echo "::warning::ffmpeg has no libopus encoder; episodes fall back to MP3"
          fi
          ffmpeg -hide_banner -version </dev/null | sed -n 1p

      # The Vercel CLI is the fallback for a missing long-lived Blob token. Its token lives in this
      # step alone, so no package the engine loads can read an account-wide Vercel token (SEC-03).
      - name: Blob credentials
        shell: bash
        env:
          HAS_BLOB: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # With the long-lived Blob token the engine needs nothing from Vercel: the pull below (which
          # also needs a working VERCEL_TOKEN, and failed with "User not found" while that secret was
          # dead, leaving every briefing without stored audio) is skipped, saving its 10 to 20 seconds.
          if [ "$HAS_BLOB" = "true" ]; then exit 0; fi
          # Vercel Blob hides its long-lived token and issues short-lived OIDC credentials instead.
          # Pull them with the Vercel token; the engine reads VERCEL_OIDC_TOKEN and BLOB_STORE_ID.
          # The CLI edits .gitignore and writes .vercel and .env.local, which the publish write guard
          # refuses, so it runs in a scratch directory outside the checkout.
          mkdir -p "$RUNNER_TEMP/vercel"
          (
            cd "$RUNNER_TEMP/vercel"
            npx --yes vercel@65.8.0 link --yes --project knowledge-hub --scope somesh-ks-projects
            npx --yes vercel@65.8.0 env pull "$RUNNER_TEMP/audio.env" --environment=production --yes
          )
          # Take only the two Blob credentials. Sourcing the whole file would let any pulled variable
          # override a GitHub secret and would mangle values that contain a dollar sign. Hidden
          # secrets come back as the text [SENSITIVE], which the engine ignores.
          pulled() { grep -m1 "^$1=" "$RUNNER_TEMP/audio.env" | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          VERCEL_OIDC_TOKEN=$(pulled VERCEL_OIDC_TOKEN) || { echo "::error::VERCEL_OIDC_TOKEN missing from the pulled env"; exit 1; }
          echo "::add-mask::$VERCEL_OIDC_TOKEN"
          BLOB_STORE_ID=$(pulled BLOB_STORE_ID) || { echo "::error::BLOB_STORE_ID missing from the pulled env"; exit 1; }
          rm -f "$RUNNER_TEMP/audio.env"
          # Later steps read them; the engine step is the only one.
          { echo "VERCEL_OIDC_TOKEN=$VERCEL_OIDC_TOKEN"; echo "BLOB_STORE_ID=$BLOB_STORE_ID"; } >> "$GITHUB_ENV"

      # Audio failures leave audio null and never block the text digest.
      - name: ${{ inputs.step_name || 'Audio' }}
        shell: bash
        env:
          # When set, the engine uploads with this long-lived token and ignores the OIDC pair below,
          # which the CLI issues for the development environment that the Blob store may not allow.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          SPEECHIFY_VOICE_ID: ${{ vars.SPEECHIFY_VOICE_ID }}
          # The second host of a discussion episode, as the site has it, so a turn narrated here is
          # stored under the name the site looks for. Unset reads as the default second voice.
          SPEECHIFY_VOICE_ID_B: ${{ vars.SPEECHIFY_VOICE_ID_B }}
          SPEECHIFY_MONTHLY_CHARS: ${{ vars.SPEECHIFY_MONTHLY_CHARS }}
          SINGULARITY_GIT_NAME: ${{ vars.SINGULARITY_GIT_NAME || vars.DISPATCH_GIT_NAME }}
          SINGULARITY_GIT_EMAIL: ${{ vars.SINGULARITY_GIT_EMAIL || vars.DISPATCH_GIT_EMAIL }}
          PRUNE_NOW: ${{ inputs.prune_now }}
        run: |
          prune_args=(--prune 120)
          [ "$PRUNE_NOW" = "true" ] && prune_args+=(--prune-now)
          npm run --silent singularity -- publish "${prune_args[@]}"

      # Whatever narrate did: a timeline it wrote must reach the store even when a later digest failed
      # or the commit did not push, or the next run narrates the same digest again and pays for it
      # twice. A failed upload is tried three times; if it still fails the job is red.
      - name: Save content
        if: ${{ !cancelled() && steps.content.outcome == 'success' }}
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            npm run --silent singularity -- content push || { sleep $((attempt * 10)); continue; }
            exit 0
          done
          exit 1
