version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps are reviewed by hand: TypeScript is pinned to 6.x on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Biome 2.6 adds rules that fail Lint in about 60 files (2026-11-03); take it in a pull request
      # of its own that fixes them, then delete this entry.
      - dependency-name: "@biomejs/biome"
    # One pull request a week for all minor and patch bumps: each pull request costs a review, both
    # browser runs and a deploy in three projects (2026-11-01 audit).
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
