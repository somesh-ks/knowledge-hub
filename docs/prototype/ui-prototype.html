}

/* ------------------------------------------------------------------ banners and states */

.banner-stack {
  display: grid;
  gap: var(--space-2);
}

.banner-stack:not(:empty) {
  padding-block-start: var(--space-2);
}

.banner {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: start;
  gap: var(--space-3);
  padding: var(--banner-padding);
  border-radius: var(--banner-radius);
  background: var(--tone-bg);
  color: var(--color-on-surface);
}

.banner[data-tone="info"] {
  --tone-bg: var(--color-info-subtle);
  --tone: var(--color-info);
}

.banner[data-tone="warning"] {
  --tone-bg: var(--color-warning-subtle);
  --tone: var(--color-warning);
}

.banner[data-tone="danger"] {
  --tone-bg: var(--color-danger-subtle);
  --tone: var(--color-danger);
}

.banner[data-tone="success"] {
  --tone-bg: var(--color-success-subtle);
  --tone: var(--color-success);
}

.banner .icon {
  margin-block-start: 0.125rem;
  color: var(--tone);
}

.banner-title {
  font-weight: var(--font-weight-semibold);
}

.banner-body {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.banner-action {
  align-self: center;
  min-height: var(--size-touch);
  padding-inline: var(--space-3);
  border-radius: var(--control-radius-sm);
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-meta);
  background: color-mix(in oklch, var(--color-on-surface) 8%, transparent);
}

.empty {
  display: grid;
  justify-items: start;
  gap: var(--space-4);
  padding-block: var(--space-8);
}

.empty .cover {
  width: var(--cover-size-hero);
}

.empty h1 {
  font-size: var(--text-display-size);
  font-weight: var(--text-display-weight);
  letter-spacing: var(--text-display-tracking);
  line-height: var(--text-display-leading);
}

.empty p {
  max-width: 34ch;
  color: var(--color-on-surface-muted);
}

.empty .btn-primary {
  width: auto;
}

/* ------------------------------------------------------------------ hero */

.hero {
  display: grid;
  grid-template-columns: var(--cover-size-hero) minmax(0, 1fr);
  align-items: end;
  column-gap: var(--space-4);
  padding-block: var(--space-6) var(--space-8);
}

.hero-text {
  min-width: 0;
}

.hero h1 {
  font-family: var(--text-display-family);
  font-size: var(--text-display-size);
  font-weight: var(--text-display-weight);
  letter-spacing: var(--text-display-tracking);
  line-height: var(--text-display-leading);
}

.hero-meta {
  margin-block-start: var(--space-3);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  line-height: var(--font-leading-caption);
}

.hero-cta {
  grid-column: 1 / -1;
  margin-block-start: var(--space-6);
}

.hero-hint {
  grid-column: 1 / -1;
  margin-block-start: var(--space-3);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  width: 100%;
  min-height: var(--cta-height);
  padding-inline: var(--space-4);
  border-radius: var(--cta-radius);
  background: var(--cta-bg);
  color: var(--cta-fg);
  font-size: var(--font-size-label-lg);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--font-tracking-label-lg);
}

.cta-main {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
}

.cta-time {
  font-weight: var(--font-weight-medium);
  font-size: var(--font-size-meta);
  opacity: 0.9;
}

@media (hover: hover) and (pointer: fine) {
  .cta:hover {
    background: var(--cta-bg-hover);
  }
}

.cta:active {
  background: var(--cta-bg-pressed);
}

.cta[aria-disabled="true"] {
  background: var(--color-surface-sunken);
  color: var(--color-on-surface-disabled);
  cursor: default;
}

.cta[aria-disabled="true"]:active {
  transform: none;
}

.cta[data-loading="true"] .swap {
  display: none;
}

.cta .spinner {
  display: none;
}

.cta[data-loading="true"] .spinner {
  display: block;
}

/* ------------------------------------------------------------------ the briefing and its rail */

.briefing {
  /* 32px, not 44: the chapter row starts 28px in, and two hit areas never overlap. */
  --rail-hit-width: calc(var(--rail-gutter) - var(--space-1));
  position: relative;
  padding-inline-start: var(--rail-gutter);
}

.rail {
  position: absolute;
  inset-block: 0;
  inset-inline-start: calc(var(--rail-center) - var(--rail-width) / 2);
  width: var(--rail-width);
  border-radius: var(--stroke-rail);
  background: var(--rail-track);
  pointer-events: none;
}

.rail-fill {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--rail-fill);
  transform-origin: top;
  transform: scaleY(var(--player-progress, 0));
}

/* A short glide only when the playhead jumps (a tap on an item); continuous play has none. */
.rail-fill[data-seeking] {
  transition: transform var(--duration-sheet-in) var(--ease-out);
}

/* Tap target for seeking: one flush strip, so the gaps between nodes are live too. */
.rail-hit {
  position: absolute;
  inset-block: 0;
  inset-inline-start: calc(var(--rail-center) - var(--rail-hit-width) / 2);
  width: var(--rail-hit-width);
  z-index: 2;
  cursor: pointer;
}

.chapter-block {
  margin-block-end: var(--item-section-gap);
}

.chapter-block:last-child {
  margin-block-end: var(--space-8);
}

.chapter {
  position: relative;
  margin-block-end: var(--space-4);
}

.chapter-node {
  position: absolute;
  inset-block-start: calc((var(--size-touch) - var(--rail-node-chapter)) / 2);
  inset-inline-start: calc(var(--rail-center) - var(--rail-gutter) - var(--rail-node-chapter) / 2);
  width: var(--rail-node-chapter);
  height: var(--rail-node-chapter);
  border-radius: var(--radius-xs);
  background: var(--color-surface);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-node-idle);
  z-index: 1;
  transition:
    background-color var(--duration-state) var(--ease-out),
    box-shadow var(--duration-state) var(--ease-out);
}

.chapter[data-state="played"] .chapter-node,
.chapter[data-state="current"] .chapter-node {
  background: var(--rail-fill);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-fill);
}

.chapter-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch);
  padding-inline: var(--space-2) var(--space-3);
  margin-inline: calc(var(--space-2) * -1) calc(var(--space-3) * -1);
  width: calc(100% + var(--space-2) + var(--space-3));
  border-radius: var(--sheet-row-radius);
  text-align: start;
  font-family: var(--text-heading-family);
  font-size: var(--text-heading-size);
  font-weight: var(--text-heading-weight);
  letter-spacing: var(--text-heading-tracking);
  line-height: var(--text-heading-leading);
}

.chapter-time {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
  letter-spacing: var(--font-tracking-caption);
}

@media (hover: hover) and (pointer: fine) {
  .chapter-btn:hover {
    background: var(--color-surface-sunken);
  }
}

.chapter-btn:active {
  background: var(--color-surface-sunken);
}

.item {
  position: relative;
  margin-block-end: var(--item-gap);
}

.item:last-child {
  margin-block-end: 0;
}

.node {
  position: absolute;
  inset-block-start: calc(
    var(--text-title-leading) *
    var(--text-title-size) /
    2 -
    var(--rail-node) /
    2
  );
  inset-inline-start: calc(var(--rail-center) - var(--rail-gutter) - var(--rail-node) / 2);
  width: var(--rail-node);
  height: var(--rail-node);
  border-radius: var(--radius-round);
  background: var(--color-surface);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-node-idle);
  z-index: 1;
  transition:
    transform var(--duration-state) var(--ease-out),
    box-shadow var(--duration-state) var(--ease-out),
    background-color var(--duration-state) var(--ease-out);
}

.item[data-lead] .node {
  inset-block-start: calc(
    var(--text-lead-leading) *
    var(--text-lead-size) /
    2 -
    var(--rail-node) /
    2
  );
}

.item[data-state="played"] .node {
  background: var(--rail-fill);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-fill);
}

.item[data-state="current"] .node {
  background: var(--rail-fill);
  box-shadow:
    0 0 0 var(--rail-node-ring) var(--rail-fill),
    0 0 0 var(--rail-node-halo) color-mix(in oklch, var(--rail-fill) 24%, transparent);
  transform: scale(var(--rail-node-current-scale));
}

.item-title {
  font-family: var(--text-title-family);
  font-size: var(--text-title-size);
  font-weight: var(--text-title-weight);
  letter-spacing: var(--text-title-tracking);
  line-height: var(--text-title-leading);
  text-wrap: balance;
}

.item[data-lead] .item-title {
  font-family: var(--text-lead-family);
  font-size: var(--text-lead-size);
  font-weight: var(--text-lead-weight);
  letter-spacing: var(--text-lead-tracking);
  line-height: var(--text-lead-leading);
}

.item-title a {
  text-decoration: underline;
  text-decoration-color: transparent;
  text-decoration-thickness: var(--stroke-rail);
  transition: text-decoration-color var(--duration-hover) var(--ease-hover);
}

@media (hover: hover) and (pointer: fine) {
  .item-title a:hover {
    text-decoration-color: var(--color-accent);
  }
}

.item-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-block-start: var(--space-1);
}

.item-byline {
  display: flex;
  flex-wrap: wrap;
  min-width: 0;
  column-gap: var(--space-3);
  font-size: var(--font-size-meta);
  line-height: var(--font-leading-caption);
  color: var(--color-on-surface-muted);
}

.item-source {
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
}

.item-summary {
  margin-block-start: var(--space-3);
  font-family: var(--text-reading-family);
  font-size: var(--text-reading-size);
  font-weight: var(--text-reading-weight);
  letter-spacing: var(--text-reading-tracking);
  line-height: var(--text-reading-leading);
  max-width: var(--layout-measure);
  transition: color var(--duration-state) var(--ease-hover);
}

.item-why {
  margin-block-start: var(--space-3);
  max-width: var(--layout-measure);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  line-height: var(--font-leading-body);
}

.item-why-label {
  margin-inline-end: var(--space-1);
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
}

/* While listening, the current item keeps full ink; the others step back. Color, not opacity,
   so every line stays above 4.5:1. */
.briefing[data-live] .item:not([data-state="current"]) .item-summary {
  color: var(--color-on-surface-muted);
}

/* The visual face is 36px; the button is 44px. Negative margins keep the layout box at the face
   size and push the hit area outward, so it never overlaps a neighbor. */
.item-play {
  flex: none;
  margin-block: calc((var(--size-touch) - var(--item-play-size)) / -2);
  margin-inline-end: calc((var(--size-touch) - var(--item-play-size)) / -2);
  display: grid;
  place-items: center;
  width: var(--size-touch);
  height: var(--size-touch);
}

.item-play-face {
  display: grid;
  place-items: center;
  width: var(--item-play-size);
  height: var(--item-play-size);
  border-radius: var(--item-play-radius);
  background: var(--color-surface-sunken);
  color: var(--color-accent);
  transition:
    background-color var(--duration-hover) var(--ease-hover),
    color var(--duration-hover) var(--ease-hover);
}

.item-play-face .icon {
  width: 1rem;
  height: 1rem;
}

@media (hover: hover) and (pointer: fine) {
  .item-play:hover .item-play-face {
    background: var(--color-accent);
    color: var(--color-on-accent);
  }
}

.item-play[data-current="true"] .item-play-face {
  background: var(--color-accent-subtle);
}

.item-play[data-current="true"][data-playing="true"] .item-play-face {
  background: var(--color-accent);
  color: var(--color-on-accent);
}

/* ------------------------------------------------------------------ earlier and archive */

.earlier {
  padding-block: var(--space-8) var(--space-12);
}

.section-title {
  font-family: var(--text-heading-family);
  font-size: var(--text-heading-size);
  font-weight: var(--text-heading-weight);
  letter-spacing: var(--text-heading-tracking);
  line-height: var(--text-heading-leading);
}

.earlier .section-title {
  margin-block-end: var(--space-3);
}

.archive-list {
  display: grid;
}

.archive-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--archive-row-padding);
  margin-inline: calc(var(--archive-row-padding) * -1);
  border-radius: var(--archive-row-radius);
  text-decoration: none;
}

.archive-row .cover {
  --cover-radius: var(--cover-radius-thumb);
  width: var(--cover-size-row);
  box-shadow: none;
}

.archive-date {
  display: block;
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-label);
}

.archive-meta {
  display: block;
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  line-height: var(--font-leading-caption);
}

.archive-kind {
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
}

.archive-row .icon {
  color: var(--color-on-surface-subtle);
}

@media (hover: hover) and (pointer: fine) {
  .archive-row:hover {
    background: var(--color-surface-sunken);
  }
}

.archive-row:active {
  background: var(--color-surface-sunken);
}

.earlier-all {
  margin-block-start: var(--space-4);
}

.foot {
  max-width: 52ch;
  padding-block-end: var(--space-8);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

/* Archive view */

.archive-view {
  padding-block: var(--space-4) var(--space-16);
}

.archive-view h1 {
  font-family: var(--text-display-family);
  font-size: var(--text-display-size);
  font-weight: var(--text-display-weight);
  letter-spacing: var(--text-display-tracking);
  line-height: var(--text-display-leading);
  margin-block-end: var(--space-2);
}

.archive-lede {
  color: var(--color-on-surface-muted);
  margin-block-end: var(--space-8);
}

.year-group {
  margin-block-end: var(--space-6);
}

.year-group > summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  min-height: var(--size-touch);
  font-family: var(--text-lead-family);
  font-size: var(--text-lead-size);
  font-weight: var(--text-lead-weight);
  letter-spacing: var(--text-lead-tracking);
  cursor: pointer;
  list-style: none;
}

.year-group > summary::-webkit-details-marker,
.month-group > summary::-webkit-details-marker {
  display: none;
}

.month-group > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch);
  padding-inline: var(--space-3);
  margin-inline: calc(var(--space-3) * -1);
  border-radius: var(--sheet-row-radius);
  font-family: var(--text-heading-family);
  font-size: var(--text-heading-size);
  font-weight: var(--text-heading-weight);
  letter-spacing: var(--text-heading-tracking);
  cursor: pointer;
  list-style: none;
}

.month-count {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.month-count .icon {
  transition: transform var(--duration-state) var(--ease-out);
}

.month-group[open] > summary .month-count .icon {
  transform: rotate(180deg);
}

@media (hover: hover) and (pointer: fine) {
  .month-group > summary:hover {
    background: var(--color-surface-sunken);
  }
}

.month-group::details-content {
  block-size: 0;
  overflow-y: clip;
  transition:
    block-size var(--duration-enter) var(--ease-out),
    content-visibility var(--duration-enter) allow-discrete;
}

.month-group[open]::details-content {
  block-size: auto;
}

.month-body {
  padding-block: var(--space-1) var(--space-3);
}

/* ------------------------------------------------------------------ mini player */

.mini {
  position: fixed;
  z-index: var(--z-mini);
  inset-inline: max(var(--mini-player-inset), var(--safe-left))
    max(var(--mini-player-inset), var(--safe-right));
  inset-block-end: max(var(--mini-player-inset), var(--safe-bottom));
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  max-width: var(--layout-mini-max);
  margin-inline: auto;
  padding: var(--mini-player-inset);
  border-radius: var(--mini-player-radius);
  background: var(--mini-player-bg);
  box-shadow: var(--mini-player-shadow);
  --color-focus-gap: var(--color-surface-overlay);
  /* Hidden state: translated away and not focusable. */
  transform: translateY(calc(100% + var(--space-6)));
  opacity: 0;
  visibility: hidden;
  transition:
    transform var(--duration-sheet-out) var(--ease-drawer),
    opacity var(--duration-state) var(--ease-out),
    visibility 0s linear var(--duration-sheet-out);
  view-transition-name: mini-player;
}

.mini[data-visible="true"] {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition:
    transform var(--duration-sheet-in) var(--ease-drawer),
    opacity var(--duration-state) var(--ease-out),
    visibility 0s;
}

.mini-progress {
  position: absolute;
  inset-inline: var(--mini-player-inset);
  inset-block-start: 0;
  height: var(--mini-player-progress-height);
  overflow: hidden;
  border-radius: var(--radius-xs);
  pointer-events: none;
}

.mini-progress-fill {
  display: block;
  height: 100%;
  background: var(--color-accent);
  transform-origin: left;
  transform: scaleX(var(--player-progress, 0));
}

.mini-open {
  display: grid;
  grid-template-columns: var(--mini-player-cover-size) minmax(0, 1fr);
  align-items: center;
  gap: var(--space-3);
  min-height: var(--mini-player-control-size);
  padding-inline-end: var(--space-2);
  border-radius: var(--mini-player-control-radius);
  text-align: start;
}

.mini-open .cover {
  --cover-radius: var(--cover-radius-thumb);
  width: var(--mini-player-cover-size);
  box-shadow: none;
}

.mini-text {
  display: grid;
  min-width: 0;
}

.mini-section {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
}

.mini-title {
  overflow: hidden;
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini-btn {
  display: grid;
  place-items: center;
  width: var(--mini-player-control-size);
  height: var(--mini-player-control-size);
  border-radius: var(--mini-player-control-radius);
}

.mini-btn[data-primary] {
  background: var(--color-accent);
  color: var(--color-on-accent);
}

@media (hover: hover) and (pointer: fine) {
  .mini-btn:not([data-primary]):hover,
  .mini-open:hover {
    background: var(--color-surface-sunken);
  }

  .mini-btn[data-primary]:hover {
    background: var(--color-accent-hover);
  }
}

.mini-btn[data-primary]:active {
  background: var(--color-accent-pressed);
}

/* While the player sheet is open, its cover is the one on screen. */
html[data-player="open"] .mini-open .cover {
  visibility: hidden;
}

/* ------------------------------------------------------------------ expanded player */

dialog.player {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--color-on-surface);
  overflow: visible;
}

dialog.player::backdrop {
  background: transparent;
}

.player-scrim {
  position: absolute;
  inset: 0;
  background: var(--color-scrim);
  opacity: 0;
}

.player-panel {
  /* The cover's key color arrives inline from the digest; the app accent is the fallback. */
  --cover-key: var(--color-accent);
  --player-key: var(--color-accent);
  --color-cover-accent: var(--player-key);
  --color-focus-ring: var(--player-key);
  --color-focus-gap: var(--player-surface);
  --player-surface: color-mix(
    in oklch,
    var(--cover-key, var(--color-accent)) calc(var(--player-tint-mix) * 100%),
    var(--color-surface-raised)
  );
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  max-width: var(--layout-column);
  margin-inline: auto;
  padding-block-start: var(--safe-top);
  padding-inline: max(var(--player-padding), var(--safe-left))
    max(var(--player-padding), var(--safe-right));
  background: var(--player-surface);
  transform: translateY(100%);
  will-change: transform;
}

/* Cover accent flows into the player: lightness is pinned per mode so the derived color always
   clears 3:1 against the sheet, whatever the palette. Hue and chroma come from the cover. */
.player-panel[data-cover-key] {
  --player-key: oklch(from var(--cover-key) 0.5 min(c, 0.17) h);
}

:root[data-theme="dark"] .player-panel[data-cover-key] {
  --player-key: oklch(from var(--cover-key) 0.78 min(c, 0.17) h);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .player-panel[data-cover-key] {
    --player-key: oklch(from var(--cover-key) 0.78 min(c, 0.17) h);
  }
}

.player-drag {
  display: flex;
  flex: 0 1 auto;
  flex-direction: column;
  min-height: 0;
  touch-action: none;
}

.player-handle {
  align-self: center;
  width: var(--player-handle-width);
  height: var(--player-handle-height);
  margin-block: var(--space-2);
  border-radius: var(--radius-xs);
  background: var(--player-handle-color);
}

.player-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: var(--size-touch);
}

.player-bar-date {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.player-cover {
  display: grid;
  place-items: center;
  flex: 0 1 auto;
  min-height: 0;
  padding-block: var(--space-2) var(--space-4);
}

.player-cover .cover {
  --cover-radius: var(--cover-radius-large);
  width: min(100%, var(--cover-size-player), 36dvh);
  transform-origin: top left;
  will-change: transform;
}

.player-meta {
  display: grid;
  gap: var(--space-1);
}

.player-section {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.player-title {
  font-family: var(--text-title-family);
  font-size: var(--text-title-size);
  font-weight: var(--text-title-weight);
  letter-spacing: var(--text-title-tracking);
  line-height: var(--text-title-leading);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.player-source {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.player-controls {
  flex: none;
  padding-block-start: var(--space-4);
}

/* Scrubber */

.scrubber {
  position: relative;
  height: var(--scrubber-hit);
  touch-action: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.scrubber-track,
.scrubber-ticks {
  position: absolute;
  inset-inline: 0;
  inset-block-start: 50%;
}

.scrubber-track {
  height: var(--scrubber-track);
  margin-block-start: calc(var(--scrubber-track) / -2);
  border-radius: var(--radius-xs);
  background: var(--color-track);
  overflow: hidden;
  transition: transform var(--duration-press-out) var(--ease-out);
}

.scrubber[data-dragging] .scrubber-track {
  transform: scaleY(var(--scrubber-track-active));
}

.scrubber-fill {
  display: block;
  height: 100%;
  background: var(--color-cover-accent);
  transform-origin: left;
  transform: scaleX(var(--player-progress, 0));
}

.scrubber-ticks {
  height: 0;
  pointer-events: none;
}

.scrubber-tick {
  position: absolute;
  inset-block-start: calc(var(--scrubber-tick-height) / -2);
  width: var(--scrubber-tick-width);
  height: var(--scrubber-tick-height);
  margin-inline-start: calc(var(--scrubber-tick-width) / -2);
  border-radius: var(--stroke-hairline);
  background: var(--color-track-strong);
  transition: background-color var(--duration-state) var(--ease-out);
}

.scrubber-tick[data-chapter] {
  inset-block-start: calc(var(--scrubber-tick-chapter-height) / -2);
  height: var(--scrubber-tick-chapter-height);
}

.scrubber-tick[data-played] {
  background: var(--color-cover-accent);
}

/* The thumb is a zero-size anchor that script moves with transform. The visible disc is a
   pseudo-element, so its press scale never multiplies the anchor's translation (individual
   transform properties apply before the transform property). */
.scrubber-thumb {
  position: absolute;
  inset-block-start: 50%;
  inset-inline-start: 0;
  width: 0;
  height: 0;
  will-change: transform;
}

.scrubber-thumb::before {
  content: "";
  position: absolute;
  inset-block-start: calc(var(--scrubber-thumb) / -2);
  inset-inline-start: calc(var(--scrubber-thumb) / -2);
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  border-radius: var(--radius-round);
  background: var(--color-cover-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--player-surface, var(--color-surface-raised));
  transition: scale var(--duration-spring-pop) var(--ease-spring-pop);
}

.scrubber[data-dragging] .scrubber-thumb::before {
  scale: var(--scrubber-thumb-active-scale);
}

/* The thumb ring is a box-shadow, so the focus ring sits on the whole slider instead. */
.scrubber:focus-visible {
  border-radius: var(--control-radius-sm);
}

.scrubber-bubble {
  position: absolute;
  inset-block-end: calc(100% - var(--space-1));
  inset-inline-start: 0;
  display: grid;
  justify-items: center;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--scrubber-bubble-radius);
  background: var(--color-surface-inverse);
  color: var(--color-on-surface-inverse);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-press-in) var(--ease-out);
}

.scrubber[data-dragging] .scrubber-bubble {
  opacity: 1;
}

.scrubber-times {
  display: flex;
  justify-content: space-between;
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.scrubber-times .scrubber-chapter-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Transport controls: five targets, one dominant. */

.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: var(--space-2) var(--space-4);
}

.transport-btn {
  display: grid;
  place-items: center;
  width: var(--control-size-md);
  height: var(--control-size-md);
  border-radius: var(--control-radius-md);
  color: var(--color-on-surface);
}

.transport-btn[data-size="sm"] {
  width: var(--control-size-sm);
  height: var(--control-size-sm);
  border-radius: var(--control-radius-sm);
  color: var(--color-on-surface-muted);
}

.transport-btn[data-primary] {
  width: var(--control-size-lg);
  height: var(--control-size-lg);
  border-radius: var(--control-radius-lg);
  background: var(--color-cover-accent);
  color: var(--color-on-cover-accent);
}

.transport-btn[data-primary] .icon {
  width: var(--size-icon-lg);
  height: var(--size-icon-lg);
}

.transport-btn .icon {
  width: var(--size-icon-lg);
  height: var(--size-icon-lg);
}

@media (hover: hover) and (pointer: fine) {
  .transport-btn:not([data-primary]):hover {
    background: var(--color-surface-sunken);
    color: var(--color-on-surface);
  }
}

.transport-btn[data-primary][aria-busy="true"] .icon {
  opacity: 0;
}

.skip-label {
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-bold);
}

.player-scroll {
  flex: 1 1 0;
  min-height: 0;
  margin-inline: calc(var(--player-padding) * -1);
  padding-inline: var(--player-padding);
  padding-block-end: max(var(--space-6), var(--safe-bottom));
}

.player-section-title {
  margin-block: var(--space-4) var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.chapter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  width: 100%;
  min-height: var(--size-touch-comfortable);
  padding-inline: var(--space-3);
  border-radius: var(--sheet-row-radius);
  text-align: start;
  font-weight: var(--font-weight-semibold);
}

.chapter-row[aria-current="true"] {
  background: color-mix(in oklch, var(--color-cover-accent) 12%, transparent);
  color: var(--color-on-surface);
}

.chapter-row[aria-current="true"] .chapter-row-name::before {
  content: "";
  display: inline-block;
  width: var(--space-2);
  height: var(--space-2);
  margin-inline-end: var(--space-3);
  border-radius: var(--radius-xs);
  background: var(--color-cover-accent);
}

.chapter-row-time {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

@media (hover: hover) and (pointer: fine) {
  .chapter-row:hover {
    background: var(--color-surface-sunken);
  }
}

/* ------------------------------------------------------------------ sheets: content */

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-block-end: var(--space-2);
  padding-inline-start: var(--space-2);
}

.sheet-title {
  font-family: var(--text-heading-family);
  font-size: var(--font-size-label-lg);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--font-tracking-label-lg);
}

.sheet-lede {
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.sheet-group {
  margin-block-start: var(--space-6);
}

.sheet-group > legend,
.sheet-group > h3 {
  padding-inline: var(--space-2);
  margin-block-end: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

/* Segmented control: native radios, so arrow keys and form state come free. */

.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: var(--segmented-padding);
  border-radius: var(--segmented-radius);
  background: var(--color-surface-sunken);
}

.segmented label {
  position: relative;
  display: grid;
  place-items: center;
  min-height: calc(var(--segmented-height) - var(--segmented-padding) * 2);
  border-radius: var(--segmented-segment-radius);
  color: var(--color-on-surface-muted);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-meta);
  transition:
    background-color var(--duration-hover) var(--ease-hover),
    color var(--duration-hover) var(--ease-hover),
    transform var(--duration-press-out) var(--ease-out);
}

.segmented label:active {
  transform: scale(var(--scale-press));
  transition-duration: var(--duration-press-in), var(--duration-hover), var(--duration-hover);
}

.segmented input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.segmented {
  --segment-selected-bg: var(--segmented-selected-bg);
  --segment-selected-fg: var(--color-on-surface);
}

/* The selected segment is raised and ringed, so selection never depends on color alone. */
.segmented label:has(input:checked) {
  background: var(--segment-selected-bg);
  color: var(--segment-selected-fg);
  box-shadow:
    0 0 0 var(--stroke-hairline) color-mix(in oklch, var(--color-on-surface) 14%, transparent),
    0 1px 2px color-mix(in oklch, var(--color-on-surface) 14%, transparent);
}

.segmented label:has(input:focus-visible) {
  outline: var(--stroke-ring) solid var(--color-focus-ring);
  outline-offset: var(--stroke-ring-gap);
}

.player-panel .segmented {
  --segment-selected-bg: var(--color-cover-accent);
  --segment-selected-fg: var(--color-on-cover-accent);
}

@media (hover: hover) and (pointer: fine) {
  .segmented label:hover {
    color: var(--color-on-surface);
  }
}

/* Switch row */

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch-comfortable);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--sheet-row-radius);
}

.setting-text {
  display: grid;
}

.setting-hint {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.switch {
  appearance: none;
  position: relative;
  flex: none;
  width: var(--switch-width);
  height: var(--switch-height);
  margin: 0;
  border-radius: var(--switch-radius);
  background: var(--color-track-strong);
  cursor: pointer;
  transition: background-color var(--duration-state) var(--ease-out);
}

.switch::before {
  content: "";
  position: absolute;
  inset-block-start: var(--switch-padding);
  inset-inline-start: var(--switch-padding);
  width: var(--switch-thumb);
  height: calc(var(--switch-height) - var(--switch-padding) * 2);
  border-radius: var(--switch-thumb-radius);
  background: var(--switch-thumb-bg);
  box-shadow: 0 1px 2px color-mix(in oklch, var(--color-on-surface) 30%, transparent);
  transition: transform var(--duration-state) var(--ease-out);
}

.switch:checked {
  background: var(--color-accent);
}

.switch:checked::before {
  transform: translateX(
    calc(var(--switch-width) - var(--switch-thumb) - var(--switch-padding) * 2)
  );
}

.switch:active::before {
  transform: scaleX(1.12);
}

.switch:checked:active::before {
  transform: translateX(calc(var(--switch-width) - var(--switch-thumb) - var(--switch-padding) * 2))
    scaleX(1.12);
}

/* Range */

.range {
  appearance: none;
  width: 100%;
  height: var(--size-touch);
  margin: 0;
  background: transparent;
  cursor: pointer;
}

.range::-webkit-slider-runnable-track {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: linear-gradient(
    to right,
    var(--color-accent) var(--range-fill, 0%),
    var(--color-track) var(--range-fill, 0%)
  );
}

.range::-moz-range-track {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: var(--color-track);
}

.range::-moz-range-progress {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: var(--color-accent);
}

.range::-webkit-slider-thumb {
  appearance: none;
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  margin-block-start: calc((var(--scrubber-track) - var(--scrubber-thumb)) / 2);
  border: 0;
  border-radius: var(--radius-round);
  background: var(--color-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--color-surface-raised);
}

.range::-moz-range-thumb {
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  border: 0;
  border-radius: var(--radius-round);
  background: var(--color-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--color-surface-raised);
}

.range:disabled {
  cursor: default;
  opacity: var(--opacity-disabled);
}

/* Install hint */

.hint-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-3);
  padding: var(--banner-padding);
  border-radius: var(--banner-radius);
  background: var(--color-surface-sunken);
}

.hint-card .icon {
  margin-block-start: 0.125rem;
  color: var(--color-accent);
}

.hint-card p {
  font-size: var(--font-size-meta);
  color: var(--color-on-surface-muted);
}

.hint-card strong {
  display: block;
  color: var(--color-on-surface);
  font-size: var(--font-size-body);
}

.hint-card .btn {
  grid-column: 2;
  justify-self: start;
  margin-inline-start: calc(var(--space-3) * -1);
}

/* Fields */

.field {
  display: grid;
  gap: var(--space-2);
  margin-block-start: var(--space-4);
}

.field label {
  padding-inline: var(--space-2);
  font-weight: var(--font-weight-semibold);
}

.field input[type="password"],
.field input[type="text"],
.field select {
  min-height: var(--field-height);
  padding-inline: var(--field-padding);
  border: var(--stroke-hairline) solid var(--field-border);
  border-radius: var(--field-radius);
  background: var(--field-bg);
  color: var(--color-on-surface);
}

.field input[aria-invalid="true"] {
  border-color: var(--color-danger);
}

.field-hint {
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.field-error {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding-inline: var(--space-2);
  color: var(--color-danger);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.field-error .icon {
  width: 1rem;
  height: 1rem;
  margin-block-start: 0.125rem;
}

.sheet-actions {
  display: grid;
  gap: var(--space-2);
  margin-block-start: var(--space-4);
}

.botcheck {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.botcheck[data-state="ok"] .icon {
  color: var(--color-success);
}

/* Generate progress: the rail grammar again, as a short vertical list. */

.run-steps {
  position: relative;
  display: grid;
  margin-block-start: var(--space-6);
  padding-inline-start: var(--rail-gutter);
}

.run-steps::before {
  content: "";
  position: absolute;
  inset-block: var(--space-4);
  inset-inline-start: calc(var(--rail-center) - var(--rail-width) / 2);
  width: var(--rail-width);
  border-radius: var(--stroke-rail);
  background: var(--rail-track);
}

.run-step {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch);
  color: var(--color-on-surface-muted);
  transition: color var(--duration-state) var(--ease-hover);
}

.run-step::before {
  content: "";
  position: absolute;
  inset-inline-start: calc(var(--rail-center) - var(--rail-gutter) - var(--rail-node) / 2);
  width: var(--rail-node);
  height: var(--rail-node);
  border-radius: var(--radius-round);
  background: var(--color-surface-raised);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-node-idle);
  transition:
    background-color var(--duration-state) var(--ease-out),
    box-shadow var(--duration-state) var(--ease-out);
}

.run-step[data-state="done"] {
  color: var(--color-on-surface);
}

.run-step[data-state="done"]::before {
  background: var(--rail-fill);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-fill);
}

.run-step[data-state="active"] {
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
}

.run-step[data-state="active"]::before {
  background: var(--rail-fill);
  box-shadow:
    0 0 0 var(--rail-node-ring) var(--rail-fill),
    0 0 0 var(--rail-node-halo) color-mix(in oklch, var(--rail-fill) 24%, transparent);
}

.run-step[data-state="failed"] {
  color: var(--color-danger);
  font-weight: var(--font-weight-semibold);
}

.run-step[data-state="failed"]::before {
  background: var(--color-danger);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--color-danger);
}

.run-step-state {
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.run-result {
  margin-block-start: var(--space-4);
}

/* ------------------------------------------------------------------ toast */

.toast {
  inset: auto 0
    calc(
      max(var(--mini-player-inset), var(--safe-bottom)) +
      var(--mini-player-control-size) +
      var(--mini-player-inset) *
      2 +
      var(--space-2)
    )
    0;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: max-content;
  max-width: min(calc(100% - var(--page-gutter) * 2), var(--layout-dialog));
  min-height: var(--toast-min-height);
  margin-inline: auto;
  padding: var(--toast-padding) var(--toast-padding) var(--toast-padding) var(--space-4);
  border: 0;
  border-radius: var(--toast-radius);
  background: var(--toast-bg);
  color: var(--toast-fg);
  box-shadow: var(--toast-shadow);
  --color-focus-gap: var(--color-surface-inverse);
  opacity: 0;
  transform: translateY(var(--distance-medium));
  transition:
    opacity var(--duration-exit) var(--ease-out),
    transform var(--duration-exit) var(--ease-out),
    overlay var(--duration-exit) allow-discrete,
    display var(--duration-exit) allow-discrete;
}

.toast:popover-open {
  opacity: 1;
  transform: none;
  transition-duration: var(--duration-enter);
}

@starting-style {
  .toast:popover-open {
    opacity: 0;
    transform: translateY(var(--distance-medium));
  }
}

.toast-action {
  min-height: var(--size-touch);
  padding-inline: var(--space-3);
  border-radius: var(--control-radius-sm);
  font-weight: var(--font-weight-semibold);
  background: color-mix(in oklch, var(--toast-fg) 14%, transparent);
}

.toast-action:focus-visible {
  outline-color: var(--toast-fg);
}

/* ------------------------------------------------------------------ chapters aside (wide) */

.aside {
  display: none;
}

@media (min-width: 64rem) {
  .shell {
    display: grid;
    grid-template-columns: var(--layout-aside) minmax(0, var(--layout-column));
    column-gap: var(--space-12);
    justify-content: center;
    max-width: none;
  }

  /* Header and banners span the same width as the aside plus the column, so the wordmark sits
     over the aside and the actions over the reading column. */
  .site-header-inner,
  .banner-stack {
    max-width: calc(
      var(--layout-aside) +
      var(--space-12) +
      var(--layout-column) +
      var(--page-gutter) *
      2
    );
  }

  .aside {
    position: sticky;
    inset-block-start: calc(var(--header-height, 3.5rem) + var(--safe-top) + var(--space-6));
    align-self: start;
    display: grid;
    gap: var(--space-4);
    padding-block-start: var(--space-6);
  }

  .aside .cover {
    --cover-radius: var(--cover-radius-hero);
    width: 100%;
  }

  .aside-nav {
    display: grid;
  }

  .aside-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: var(--size-touch);
    padding-inline: var(--space-3);
    margin-inline: calc(var(--space-3) * -1);
    border-radius: var(--sheet-row-radius);
    color: var(--color-on-surface-muted);
    font-size: var(--font-size-meta);
    font-weight: var(--font-weight-semibold);
    text-decoration: none;
  }

  .aside-link[data-state="current"] {
    color: var(--color-on-surface);
    background: var(--color-accent-subtle);
  }

  @media (hover: hover) and (pointer: fine) {
    .aside-link:hover {
      background: var(--color-surface-sunken);
      color: var(--color-on-surface);
    }
  }
}

/* ------------------------------------------------------------------ wider screens */

@media (min-width: 40rem) {
  .hero {
    grid-template-columns: var(--cover-size-hero-wide) minmax(0, 1fr);
    column-gap: var(--space-6);
    padding-block: var(--space-8) var(--space-12);
  }

  /* The player becomes a centered modal card. Modals stay centered and scale in; the cover
     does not morph, because there is no bottom edge for it to travel from. */
  .player-panel {
    inset: 0;
    margin: auto;
    width: var(--layout-player-dialog);
    max-width: 100%;
    height: fit-content;
    max-height: calc(100dvh - var(--space-12));
    padding-block-start: var(--space-2);
    padding-inline: var(--player-padding);
    border-radius: var(--sheet-radius);
    box-shadow: var(--sheet-shadow);
    overflow: hidden;
  }

  .player-scroll {
    flex: 0 1 auto;
    max-height: 15rem;
    padding-block-end: var(--space-4);
  }

  .player-cover .cover {
    width: min(100%, var(--cover-size-player), 34dvh);
  }

  .nav-archive {
    display: inline-flex;
  }
}

/* ------------------------------------------------------------------ small additions */

.nav-archive {
  display: none;
}

/* Play and pause share one slot: the outgoing glyph shrinks, fades and blurs as the incoming one
   arrives. Small, fast, and keyed on the button's data-playing. */
.swap {
  position: relative;
  display: grid;
  place-items: center;
}

.swap > .icon {
  grid-area: 1 / 1;
  transition:
    opacity var(--duration-state) var(--ease-out),
    transform var(--duration-state) var(--ease-out),
    filter var(--duration-state) var(--ease-out);
}

[data-playing="false"] .swap-playing,
[data-playing="true"] .swap-paused {
  opacity: 0;
  transform: scale(0.7);
  filter: blur(var(--blur-enter));
}

.swap-paused {
  /* Optical center: a play triangle's mass sits left of its box. */
  translate: 0.0625rem 0;
}

.skip-label {
  font-size: 8px;
  font-weight: var(--font-weight-bold);
  font-family: var(--font-ui);
}

[data-loading="true"] > .swap {
  opacity: 0;
}

.transport-btn[data-primary] .spinner {
  display: none;
  position: absolute;
  color: var(--color-on-cover-accent);
}

.transport-btn[data-primary] {
  position: relative;
}

.transport-btn[data-primary][data-loading="true"] .spinner {
  display: block;
}

.toast-dismiss {
  display: grid;
  place-items: center;
  width: var(--size-touch);
  height: var(--size-touch);
  margin-inline-start: calc(var(--space-2) * -1);
  border-radius: var(--control-radius-sm);
  opacity: 0.8;
}

.toast-dismiss:focus-visible {
  outline-color: var(--toast-fg);
}

.proto-group > summary {
  width: fit-content;
  list-style: none;
}

.proto-group > summary::-webkit-details-marker {
  display: none;
}

.proto-group {
  padding-block-start: var(--space-4);
  border-block-start: var(--stroke-hairline) solid var(--color-border-hairline);
}

.proto-group select {
  font-size: var(--font-size-body);
}

/* ------------------------------------------------------------------ view transitions */

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: var(--duration-state);
  animation-timing-function: var(--ease-out);
}

::view-transition-group(mini-player) {
  animation: none;
}

/* ------------------------------------------------------------------ forced colors */

@media (forced-colors: active) {
  .rail {
    background: GrayText;
  }

  .rail-fill,
  .mini-progress-fill,
  .scrubber-fill {
    background: Highlight;
  }

  .node,
  .chapter-node {
    border: var(--stroke-rail) solid CanvasText;
  }

  .item[data-state="current"] .node,
  .item[data-state="played"] .node,
  .chapter[data-state="current"] .chapter-node,
  .chapter[data-state="played"] .chapter-node {
    background: Highlight;
    border-color: Highlight;
  }

  .scrubber-thumb {
    background: Highlight;
    forced-color-adjust: none;
  }

  .mini,
  .cover {
    border: var(--stroke-hairline) solid CanvasText;
  }

  .switch {
    border: var(--stroke-rail) solid ButtonText;
  }

  .switch:checked {
    background: Highlight;
  }
}

.colon {
  display: inline-block;
  width: 0.34em;
  text-align: center;
  /* The narrow colon glyph, so the fixed box centers it instead of clipping a tabular one. */
  font-variant-numeric: proportional-nums;
  font-feature-settings: "tnum" 0;
}

/* ------------------------------------------------------------------ refinements */

.back-link {
  margin-inline-start: calc(var(--space-3) * -1);
}

.year-group > summary .icon {
  color: var(--color-on-surface-subtle);
  transition: transform var(--duration-state) var(--ease-out);
}

.year-group[open] > summary .icon {
  transform: rotate(180deg);
}

.btn-primary[data-busy="true"] {
  cursor: progress;
}

.btn-primary[data-busy="true"] .spinner {
  color: var(--cta-fg);
}

/* Containers that take focus on open (sheets, the player) show no ring of their own. */
.player-panel:focus-visible {
  outline: none;
  box-shadow: none;
}

.setting-stack {
  display: grid;
  gap: 0;
  padding: var(--space-2) var(--space-2) 0;
}

.setting-stack > label {
  font-weight: var(--font-weight-regular);
}

.setting-stack .range {
  margin-inline: calc(var(--space-2) * -1);
  width: calc(100% + var(--space-2) * 2);
}

.hint-card strong {
  margin-block-end: var(--space-1);
}

.field + .botcheck {
  margin-block-start: var(--space-3);
}

/* Very narrow phones: the cover stacks above the date so the date keeps its size. */
@media (max-width: 23.5rem) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--space-4);
  }

  .hero .cover {
    width: 6.5rem;
  }
}

/* Component rules that set display must not defeat the hidden attribute. Keep this rule last. */
[hidden] {
  display: none;
}

/* The mini player owns vertical pans on itself, so a swipe up reaches script instead of scrolling the page. */
.mini-open {
  touch-action: none;
}

.node,
.chapter-node {
  pointer-events: none;
}

  function createScrubber(options) {
    const { root: root2, player: player2, timeline: timeline2 } = options;
    const fill = root2.querySelector(".scrubber-fill");
    const thumb = root2.querySelector(".scrubber-thumb");
    const bubble = root2.querySelector(".scrubber-bubble");
    const bubbleTime = root2.querySelector(".scrubber-bubble-time");
    const bubbleItem = root2.querySelector(".scrubber-bubble-item");
    const ticks = [...root2.querySelectorAll(".scrubber-tick")];
    const scope = root2.parentElement ?? root2;
    const elapsed = scope.querySelector(".scrubber-elapsed");
    const remaining = scope.querySelector(".scrubber-remaining");
    const total = timeline2.durationSec;
    let width = 1;
    let dragging = false;
    let activePointer = -1;
    let lastItem = 0;
    let lastDetentAt = Number.NEGATIVE_INFINITY;
    let lastWholeSecond = -1;
    const hysteresis = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue("--scrubber-detent-hysteresis")
    );
    new ResizeObserver(() => {
      width = root2.getBoundingClientRect().width || 1;
      paint(player2.getState().time);
    }).observe(root2);
    function itemLabel(index) {
      return `Item ${index + 1} of ${timeline2.items.length}`;
    }
    function paint(time) {
      const fraction = clamp(time / total, 0, 1);
      if (fill) fill.style.setProperty("--player-progress", fraction.toFixed(5));
      if (thumb) thumb.style.transform = `translate3d(${(fraction * width).toFixed(2)}px, 0, 0)`;
      const whole = Math.floor(time);
      if (whole !== lastWholeSecond) {
        lastWholeSecond = whole;
        if (elapsed) elapsed.innerHTML = clockHtml(time);
        if (remaining) remaining.innerHTML = `-${clockHtml(total - time)}`;
        updateAria(time);
      }
      if (dragging && bubble && bubbleTime && bubbleItem) {
        bubbleTime.innerHTML = clockHtml(time);
        bubbleItem.textContent = itemLabel(player2.itemAt(time));
        const half = bubble.offsetWidth / 2;
        const x = clamp(fraction * width, half, width - half) - half;
        bubble.style.transform = `translate3d(${x.toFixed(1)}px, 0, 0)`;
      }

    function updateAria(time) {
      const index = player2.itemAt(time);
      const slug = timeline2.items[index]?.section;

        "aria-valuetext",
        `${formatClock(time)} of ${formatClock(total)}, ${slug ? SECTION_TITLES[slug] : ""}, ${itemLabel(index).toLowerCase()}`

      for (const tick of ticks) {
        const index = Number(tick.dataset.index);
        const start = timeline2.items[index]?.startSec ?? 0;
        if (start <= time) tick.setAttribute("data-played", "");

      activePointer = event.pointerId;
      root2.setPointerCapture(event.pointerId);
      root2.dataset.dragging = "true";
      player2.beginScrub();
      const time = timeFromEvent(event);
      lastItem = player2.itemAt(time);

      paintTicks(time);
    });
    root2.addEventListener("pointermove", (event) => {
      if (!dragging || event.pointerId !== activePointer) return;
      const time = timeFromEvent(event);
      const item = player2.itemAt(time);
      if (item !== lastItem) {
        const boundaryItem = Math.max(item, lastItem);
        const boundary = timeline2.items[boundaryItem]?.startSec ?? 0;
        if (Math.abs(boundary - lastDetentAt) > hysteresis * total) {
          lastDetentAt = boundary;
          options.onDetent(clamp(boundary / total, 0, 1));
        }
        lastItem = item;
      }
      player2.scrubTo(time);
      paint(time);
      paintTicks(time);
    });
    const finish = (event) => {
      if (!dragging || event.pointerId !== activePointer) return;
      dragging = false;
      activePointer = -1;
      if (root2.hasPointerCapture(event.pointerId)) root2.releasePointerCapture(event.pointerId);
      delete root2.dataset.dragging;
      const time = event.type === "pointercancel" ? player2.getState().time : timeFromEvent(event);
      player2.endScrub(time);
      lastDetentAt = Number.NEGATIVE_INFINITY;
    };
    root2.addEventListener("pointerup", finish);
    root2.addEventListener("pointercancel", finish);
    root2.addEventListener("keydown", (event) => {
      const state = player2.getState();
      const step = event.shiftKey ? 15 : 5;
      let handled = true;
      switch (event.key) {
        case "ArrowLeft":
        case "ArrowDown":
          player2.seek(state.time - step);
          break;
        case "ArrowRight":
        case "ArrowUp":
          player2.seek(state.time + step);
          break;
        case "PageDown":
          if (player2.next()) options.onKeyItemSkip("next");
          break;
        case "PageUp":
          if (player2.previous()) options.onKeyItemSkip("previous");
          break;
        case "Home":
          player2.seek(0);
          break;
        case "End":
          player2.seek(total);
          break;
        default:
          handled = false;
      }
      if (handled) event.preventDefault();
    });
    player2.onFrame((time) => {
      if (dragging) return;
      paint(time);
    });
    player2.subscribe((state) => {
      paintTicks(state.time);
      updateAria(state.time);
    });
    paint(player2.getState().time);
    paintTicks(player2.getState().time);
    return { paint, paintTicks };
  }

      const comfortable = rect.top > viewport * 0.12 && rect.top < viewport * 0.5;
      if (comfortable) return;
      item.scrollIntoView({ block: "center", behavior: prefersReducedMotion() ? "auto" : "smooth" });
    }
    const observer = new ResizeObserver(measure);
    observer.observe(briefing);
    void document.fonts?.ready.then(measure);
    const offFrame = player2.onFrame((time) => paint(time));
    const offState = player2.subscribe((state) => {
      syncState(state);
      if (state.itemIndex !== lastItem && state.hasStarted) {
        lastItem = state.itemIndex;
        if (!state.scrubbing) followCurrent(state.itemIndex);
      }
    });
    if (railHit) {
      let startY = 0;
      let startX = 0;
      let moved = false;
      railHit.addEventListener("pointerdown", (event) => {
        startY = event.clientY;
        startX = event.clientX;
        moved = false;
      });
      railHit.addEventListener("pointermove", (event) => {
        if (Math.abs(event.clientY - startY) > 10 || Math.abs(event.clientX - startX) > 10)
          moved = true;
      });
      railHit.addEventListener("pointerup", (event) => {
        if (moved) return;
        const top = briefing.getBoundingClientRect().top;
        const y = event.clientY - top;
        let nearest = 0;
        let best = Number.POSITIVE_INFINITY;
        nodeY.forEach((value, index) => {
          const distance = Math.abs(value - y);
          if (distance < best) {
            best = distance;
            nearest = index;
          }
        });
        fill?.setAttribute("data-seeking", "");
        window.setTimeout(() => fill?.removeAttribute("data-seeking"), 400);
        resumeFollow();
        options.onSeekItem(nearest);
      });
    }
    measure();
    syncState(player2.getState());
    return {
      measure,
      paint,
      destroy() {
        observer.disconnect();
        offFrame();
        offState();
      }
    };
  }

  // scripts/prototype/main.ts
  var STORAGE_KEY = "dispatch-prototype";
  function loadPrefs() {
    const fallback = {
      theme: "system",
      sounds: defaultSoundsEnabled(),
      volume: 0.8,
      rate: 1,
      installHidden: false
    };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? { ...fallback, ...JSON.parse(raw) } : fallback;
    } catch {
      return fallback;
    }
  }
  function savePrefs() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
    } catch {
    }
  }
  function must(id) {
    const element = document.getElementById(id);
    if (!element) throw new Error(`Missing #${id}`);
    return element;
  }
  var params = new URLSearchParams(location.search);
  var prefs = loadPrefs();
  var timeline = buildTimeline();
  var player = createPlayer(timeline, ITEMS);
  var pageState = params.get("state") ?? "normal";
  var sound = createSoundEngine({
    isEnabled: () => prefs.sounds,
    getVolume: () => prefs.volume,
    isNarrationPlaying: () => player.isNarrating()
  });
  installGestureUnlock(sound);
  var cue = (name, options) => {
    sound.play(name, options);
  };
  player.setRate(prefs.rate);
  var live = [must("liveA"), must("liveB")];
  var liveTurn = 0;
  function announce(message) {
    const region = live[liveTurn++ % 2];
    if (!region) return;
    region.textContent = "";
    window.setTimeout(() => {
      region.textContent = message;
    }, 50);
  }
  function applyTheme() {
    const root2 = document.documentElement;
    if (prefs.theme === "system") root2.removeAttribute("data-theme");
    else root2.dataset.theme = prefs.theme;
  }
  function changeTheme(next) {
    prefs.theme = next;
    savePrefs();
    if (document.startViewTransition) document.startViewTransition(applyTheme);
    else applyTheme();
  }
  var themeParam = params.get("theme");
  if (themeParam === "light" || themeParam === "dark" || themeParam === "system")
    prefs.theme = themeParam;
  applyTheme();
  must("wordmarkSlot").innerHTML = `${MARK_SVG}<span>Dispatch</span>`;
  must("generateIcon").innerHTML = icon("refresh");
  must("settingsIcon").innerHTML = icon("sliders");
  var mini = must("mini");
  mini.innerHTML = miniMarkup();
  var playerDialog = must("playerSheet");
  playerDialog.innerHTML = playerMarkup(timeline, prefs.rate);
  var generateDialog = must("generateSheet");
  generateDialog.innerHTML = generateMarkup();
  var settingsDialog = must("settingsSheet");
  settingsDialog.innerHTML = settingsMarkup({
    theme: prefs.theme,
    sounds: prefs.sounds,
    volume: prefs.volume,
    rate: prefs.rate
  });
  var toast = must("toast");
  toast.innerHTML = toastMarkup();
  var shell = must("shell");
  var banners = must("banners");
  function startNarration() {
    resumeFollow();
    cue("play");
    player.play();
  }
  function stopNarration() {
    player.pause();
    cue("pause");
  }
  function togglePlayback() {
    const { status } = player.getState();
    if (status === "playing" || status === "loading") {
      stopNarration();
      announce("Paused.");
    } else {
      startNarration();
      announce("Playing.");
    }
  }
  function playItem(index) {
    const state = player.getState();
    if (state.hasStarted && state.status === "playing" && state.itemIndex === index) {
      stopNarration();
      announce("Paused.");
      return;
    }
    resumeFollow();
    if (state.status !== "playing") cue("play");
    player.playItem(index);
    announce(`Playing item ${index + 1} of ${ITEMS.length}: ${ITEMS[index]?.headline ?? ""}`);
  }
  function skipItem(direction) {
    const moved = direction === "next" ? player.next() : player.previous();
    if (!moved) return;
    resumeFollow();
    cue(direction === "next" ? "itemNext" : "itemPrev");
    const index = player.getState().itemIndex;
    announce(`Item ${index + 1} of ${ITEMS.length}: ${ITEMS[index]?.headline ?? ""}`);
  }
  function setRate(rate, announceIt = true) {
    player.setRate(rate);
    prefs.rate = rate;
    savePrefs();
    for (const radio of document.querySelectorAll(
      'input[name="speed"], input[name="defaultSpeed"]'
    )) {
      radio.checked = Number(radio.value) === rate;
    }
    if (announceIt) {
      cue("speedChange", { rate });
      announce(`Speed ${rate}x.`);
    }
  }
  var reader = null;
  function bannerFor(state) {
    switch (state) {
      case "offline":
      case "nothing":
      case "stale":
      case "error":
        return state;
      default:
        return null;
    }
  }
  function renderBanners(route2) {
    const kind = bannerFor(pageState);
    const show = kind && (route2 === "home" || kind === "offline");
    banners.innerHTML = show && kind ? bannerMarkup(kind) : "";
  }
  function renderHome() {
    reader?.destroy();
    reader = null;
    renderBanners("home");
    if (pageState === "empty") {
      shell.innerHTML = `<main id="main">${emptyMarkup()}</main>`;
      return;
    }
    if (pageState === "error") {
      shell.innerHTML = `<main id="main" tabindex="-1">${earlierMarkup()}</main>`;
      return;
    }
    const heroMode = pageState === "offline" ? "offline" : pageState === "preparing" ? "preparing" : "normal";
    shell.innerHTML = `${asideMarkup(timeline)}<main id="main">${heroMarkup(timeline, heroMode)}${briefingMarkup(timeline)}${earlierMarkup()}</main>`;
    reader = createReader({
      briefing: must("briefing"),
      player,
      timeline,
      onSeekItem: (index) => playItem(index)
    });
    syncPlayback(player.getState());
  }
  function renderArchive() {
    reader?.destroy();
    reader = null;
    renderBanners("archive");
    shell.innerHTML = `<main id="main">${`<a class="btn press back-link" href="#/">${icon("chevronLeft")}Today</a>`}${archiveViewMarkup()}</main>`;
  }
  function route() {
    return location.hash.startsWith("#/archive") ? "archive" : "home";
  }
  function renderRoute(moveFocus = true) {
    if (route() === "archive") renderArchive();
    else renderHome();
    document.documentElement.dataset.view = route();
    if (moveFocus) {
      window.scrollTo(0, 0);
      const heading = document.getElementById(route() === "archive" ? "archiveTitle" : "pageTitle");
      if (heading) {
        heading.setAttribute("tabindex", "-1");
        heading.focus({ preventScroll: true });
      }
    }
    document.title = route() === "archive" ? "Archive, Dispatch" : "Wednesday 7 October, Dispatch";
  }
  window.addEventListener("hashchange", () => {
    if (document.startViewTransition) document.startViewTransition(renderRoute);
    else renderRoute();
  });
  var SECTION_LABEL = (index) => {
    const slug = timeline.items[index]?.section;
    return `${slug ? SECTION_TITLES[slug] : ""}, ${index + 1} of ${ITEMS.length}`;
  };
  function syncPlayback(state) {
    const root2 = document.documentElement;
    root2.dataset.playerState = state.status;
    root2.dataset.mini = state.hasStarted ? "visible" : "hidden";
    const playing = state.status === "playing" || state.status === "loading";
    const cta = document.getElementById("cta");
    if (cta && cta.getAttribute("aria-disabled") !== "true") {
      cta.dataset.playing = String(state.status === "playing");
      const label = document.getElementById("ctaLabel");
      const time = document.getElementById("ctaTime");
      const text = state.status === "playing" ? "Pause" : state.status === "loading" ? "Preparing audio" : state.status === "paused" ? "Resume" : state.status === "ended" ? "Play again" : "Play the briefing";
      if (label) label.textContent = text;
      if (time)
        time.innerHTML = state.status === "idle" ? clockHtml(timeline.durationSec) : `${clockHtml(state.time)} of ${clockHtml(timeline.durationSec)}`;
      loadingTimer(cta, state.status === "loading");
    }
    mini.dataset.visible = String(state.hasStarted);
    const item = ITEMS[state.itemIndex];
    const miniSection = document.getElementById("miniSection");
    const miniTitle = document.getElementById("miniTitle");
    if (miniSection) miniSection.textContent = SECTION_LABEL(state.itemIndex);
    if (miniTitle && item) miniTitle.textContent = item.headline;
    const miniToggle = document.getElementById("miniToggle");
    if (miniToggle) {
      miniToggle.dataset.playing = String(state.status === "playing");
      miniToggle.setAttribute("aria-label", playing ? "Pause" : "Play");
    }
    document.getElementById("miniOpen")?.setAttribute("aria-label", `Open the player. ${item?.headline ?? ""}`);
    const section = document.getElementById("playerSection");
    const title = document.getElementById("playerTitle");
    const source = document.getElementById("playerSource");
    if (section) section.textContent = SECTION_LABEL(state.itemIndex);
    if (title && item) title.textContent = item.headline;
    if (source && item) source.textContent = `${item.source}, ${item.author}`;
    const toggle = document.getElementById("tToggle");
    if (toggle) {
      toggle.dataset.playing = String(state.status === "playing");
      toggle.setAttribute("aria-label", playing ? "Pause" : "Play");
      toggle.toggleAttribute("aria-busy", state.status === "loading");
      toggle.dataset.loading = String(state.status === "loading");
    }
    renderChapterList(state);
  }
  var loadingHandle = 0;
  function loadingTimer(cta, loading) {
    window.clearTimeout(loadingHandle);
    if (!loading) {
      cta.removeAttribute("data-loading");
      return;
    }
    loadingHandle = window.setTimeout(() => {
      cta.dataset.loading = "true";
    }, 300);
  }
  function renderChapterList(state) {
    const list = document.getElementById("chapterList");
    if (!list) return;
    list.innerHTML = timeline.sections.map(
      (section, index) => `<button class="chapter-row press" type="button" data-chapter-play="${section.firstIndex}" ${state.hasStarted && index === state.sectionIndex ? 'aria-current="true"' : ""}><span class="chapter-row-name">${SECTION_TITLES[section.slug]}</span><span class="chapter-row-time">${formatClock(section.endSec - section.startSec)}</span></button>`
    ).join("");
  }
  player.subscribe((state, previous) => {
    syncPlayback(state);
    if (previous.status !== "ended" && state.status === "ended") {
      cue("digestEnd");
      announce("Briefing finished.");
    }
  });
  player.onFrame((time, duration) => {
    const fill = document.getElementById("miniFill");
    if (fill) fill.style.setProperty("--player-progress", (time / duration).toFixed(5));
  });
  function openSheet(dialog) {
    if (dialog.open) return;
    dialog.showModal();
    cue("sheetOpen");
    if (dialog === generateDialog) generate.onOpen();
  }
  for (const dialog of [generateDialog, settingsDialog]) {
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener("close", () => cue("sheetClose"));
  }
  var generate = createGenerate({
    dialog: generateDialog,
    playSound: (name) => cue(name),
    announce,
    isOffline: () => pageState === "offline" || !navigator.onLine,
    onFinishedInBackground: (status) => {
      showToast(
        status === "success" ? "Briefing ready" : status === "nothing" ? "Nothing cleared the bar." : "The run failed",
        status === "success" ? "Open" : "Details",
        () => {
          if (status === "success")
            window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? "auto" : "smooth" });
          else openSheet(generateDialog);
        }
      );
    },
    onOpenNewBriefing: () => {
      window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? "auto" : "smooth" });
    }
  });
  var toastTimer = 0;
  function showToast(text, actionLabel, onAction) {
    const message = document.getElementById("toastText");
    const action = document.getElementById("toastAction");
    if (message) message.textContent = text;
    if (action) {
      action.textContent = actionLabel;
      action.onclick = () => {
        toast.hidePopover();
        onAction();
      };
    }
    if (toast.matches(":popover-open")) toast.hidePopover();
    toast.showPopover();
    announce(text);
    window.clearTimeout(toastTimer);
  }
  document.getElementById("toastDismiss")?.addEventListener("click", () => toast.hidePopover());
  var playerSheet = createPlayerSheet({
    dialog: playerDialog,
    panel: must("playerPanel"),
    scrim: must("playerScrim"),
    dragZone: must("playerDrag"),
    cover: must("playerCover"),
    miniCover: () => document.getElementById("miniCover"),
    openZone: must("miniOpen"),
    onCommitOpen: () => cue("sheetOpen"),
    onCommitClose: () => cue("sheetClose")
  });
  createScrubber({
    root: must("scrubber"),
    player,
    timeline,
    onDetent: (position) => cue("scrubDetent", { position }),
    onKeyItemSkip: (direction) => cue(direction === "next" ? "itemNext" : "itemPrev")
  });
  must("miniOpen").addEventListener("click", () => playerSheet.open());
  must("playerClose").addEventListener("click", () => playerSheet.close());
  must("miniToggle").addEventListener("click", togglePlayback);
  must("miniNext").addEventListener("click", () => skipItem("next"));
  must("tToggle").addEventListener("click", togglePlayback);
  must("tPrev").addEventListener("click", () => skipItem("previous"));
  must("tNext").addEventListener("click", () => skipItem("next"));
  must("tBack").addEventListener("click", () => player.skip(-15));
  must("tForward").addEventListener("click", () => player.skip(15));
  must("speedGroup").addEventListener("change", (event) => {
    const target = event.target;
    if (target.name === "speed") setRate(Number(target.value));
  });
  settingsDialog.addEventListener("change", (event) => {
    const target = event.target;
    if (target.name === "theme") changeTheme(target.value);
    if (target.name === "defaultSpeed") setRate(Number(target.value));
    if (target.id === "soundsSwitch") {
      const volume = settingsDialog.querySelector("#volumeRange");
      if (target.checked) {
        prefs.sounds = true;
        cue("toggleOn");
      } else {
        cue("toggleOff");
        prefs.sounds = false;
      }
      if (volume) volume.disabled = !prefs.sounds;
      savePrefs();
    }
    if (target.id === "volumeRange") cue("toggleOn");
    if (target.id === "stateSelect") {
      pageState = target.value;
      renderRoute(false);
    }
    if (target.id === "slowSwitch") player.setBufferDelay(target.checked ? 1400 : 0);
    if (target.id === "voiceSwitch") player.setVoiceEnabled(target.checked);
  });
  settingsDialog.addEventListener("input", (event) => {
    const target = event.target;
    if (target.id === "volumeRange") {
      prefs.volume = Number(target.value);
      target.style.setProperty("--range-fill", `${prefs.volume * 100}%`);
      savePrefs();
    }
  });
  var volumeRange = settingsDialog.querySelector("#volumeRange");
  volumeRange?.style.setProperty("--range-fill", `${prefs.volume * 100}%`);
  if (prefs.installHidden) settingsDialog.querySelector("#installHint")?.setAttribute("hidden", "");
  settingsDialog.querySelector("#hideInstall")?.addEventListener("click", () => {
    prefs.installHidden = true;
    savePrefs();
    settingsDialog.querySelector("#installHint")?.setAttribute("hidden", "");
  });
  document.addEventListener("click", (event) => {
    const target = event.target;
    const closest = (selector) => target.closest(selector);
    if (closest('a[href="#"], a[href="#run"]')) {
      event.preventDefault();
      return;
    }
    const cta = closest("#cta");
    if (cta) {
      if (cta.getAttribute("aria-disabled") !== "true") togglePlayback();
      return;
    }
    const play = closest("[data-play]");
    if (play) {
      playItem(Number(play.dataset.play));
      return;
    }
    const chapter = closest("[data-chapter-play]");
    if (chapter) {
      playItem(Number(chapter.dataset.chapterPlay));
      return;
    }
    if (closest("#openGenerate") || closest('[data-open="generate"]')) {
      openSheet(generateDialog);
      return;
    }
    if (closest("#openSettings")) {
      openSheet(settingsDialog);
      return;
    }
    const dismiss = closest("[data-close]");
    if (dismiss) {
      dismiss.closest("dialog")?.close();
      return;
    }
    if (closest('[data-action="retry"]')) {
      pageState = "normal";
      renderRoute();
    }
  });
  window.addEventListener("online", () => announce("You are back online."));
  window.addEventListener("offline", () => announce("You are offline."));
  renderRoute(false);
  syncPlayback(player.getState());
  var stateSelect = settingsDialog.querySelector("#stateSelect");
  if (stateSelect) stateSelect.value = pageState;
  var at = params.get("at");
  if (at !== null) {
    const index = Math.min(ITEMS.length - 1, Math.max(0, Number(at)));
    const entry2 = timeline.items[index];
    if (entry2) {
      player.seek(entry2.startSec + (entry2.endSec - entry2.startSec) * 0.42);
      player.play();
      if (params.get("play") !== "1") player.pause();
    }
  }
  var open = params.get("open");
  if (open === "player") playerSheet.open();
  if (open === "generate") openSheet(generateDialog);
  if (open === "settings") openSheet(settingsDialog);
  window.dispatchPrototype = { player, sound, prefs };
})();
</script>
</body>
