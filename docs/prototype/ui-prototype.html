  max-width: 52ch;
  padding-block-end: var(--space-8);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

/* Archive view */

.archive-view {
  padding-block: var(--space-4) var(--space-16);
}

.archive-view h1 {
  font-family: var(--text-display-family);
  font-size: var(--text-display-size);
  font-weight: var(--text-display-weight);
  letter-spacing: var(--text-display-tracking);
  line-height: var(--text-display-leading);
  margin-block-end: var(--space-2);
}

.archive-lede {
  color: var(--color-on-surface-muted);
  margin-block-end: var(--space-8);
}

.year-group {
  margin-block-end: var(--space-6);
}

.year-group > summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  min-height: var(--size-touch);
  font-family: var(--text-lead-family);
  font-size: var(--text-lead-size);
  font-weight: var(--text-lead-weight);
  letter-spacing: var(--text-lead-tracking);
  cursor: pointer;
  list-style: none;
}

.year-group > summary::-webkit-details-marker,
.month-group > summary::-webkit-details-marker {
  display: none;
}

.month-group > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch);
  padding-inline: var(--space-4);
  margin-inline: calc(var(--space-4) * -1);
  border-radius: var(--sheet-row-radius);
  font-family: var(--text-heading-family);
  font-size: var(--text-heading-size);
  font-weight: var(--text-heading-weight);
  letter-spacing: var(--text-heading-tracking);
  cursor: pointer;
  list-style: none;
}

.month-count {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.month-count .icon {
  transition: transform var(--duration-state) var(--ease-out);
}

.month-group[open] > summary .month-count .icon {
  transform: rotate(180deg);
}

@media (hover: hover) and (pointer: fine) {
  .month-group > summary:hover {
    background: var(--color-surface-sunken);
  }
}

.month-group::details-content {
  block-size: 0;
  overflow-y: clip;
  transition:
    block-size var(--duration-enter) var(--ease-out),
    content-visibility var(--duration-enter) allow-discrete;
}

.month-group[open]::details-content {
  block-size: auto;
}

.month-body {
  padding-block: var(--space-1) var(--space-4);
}

/* ------------------------------------------------------------------ mini player */

.mini {
  position: fixed;
  z-index: var(--z-mini);
  inset-inline: max(var(--mini-player-inset), var(--safe-left))
    max(var(--mini-player-inset), var(--safe-right));
  inset-block-end: max(var(--mini-player-inset), var(--safe-bottom));
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  max-width: var(--layout-mini-max);
  margin-inline: auto;
  padding: var(--mini-player-inset);
  border-radius: var(--mini-player-radius);
  background: var(--mini-player-bg);
  box-shadow: var(--mini-player-shadow);
  --color-focus-gap: var(--color-surface-overlay);
  /* Hidden state: translated away and not focusable. */
  transform: translateY(calc(100% + var(--space-6)));
  opacity: 0;
  visibility: hidden;
  transition:
    transform var(--duration-sheet-out) var(--ease-drawer),
    opacity var(--duration-state) var(--ease-out),
    visibility 0s linear var(--duration-sheet-out);
  view-transition-name: mini-player;
}

.mini[data-visible="true"] {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition:
    transform var(--duration-sheet-in) var(--ease-drawer),
    opacity var(--duration-state) var(--ease-out),
    visibility 0s;
}

.mini-progress {
  position: absolute;
  inset-inline: var(--mini-player-inset);
  inset-block-start: 0;
  height: var(--mini-player-progress-height);
  overflow: hidden;
  border-radius: var(--radius-xs);
  pointer-events: none;
}

.mini-progress-fill {
  display: block;
  height: 100%;
  background: var(--color-accent);
  transform-origin: left;
  transform: scaleX(var(--player-progress, 0));
}

.mini-open {
  display: grid;
  grid-template-columns: var(--mini-player-cover-size) minmax(0, 1fr);
  align-items: center;
  gap: var(--space-4);
  min-height: var(--mini-player-control-size);
  padding-inline-end: var(--space-2);
  border-radius: var(--mini-player-control-radius);
  text-align: start;
}

.mini-open .cover {
  --cover-radius: var(--cover-radius-thumb);
  width: var(--mini-player-cover-size);
  box-shadow: none;
}

.mini-text {
  display: grid;
  min-width: 0;
}

.mini-section {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
}

.mini-title {
  overflow: hidden;
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini-btn {
  display: grid;
  place-items: center;
  width: var(--mini-player-control-size);
  height: var(--mini-player-control-size);
  border-radius: var(--mini-player-control-radius);
}

.mini-btn[data-primary] {
  background: var(--color-accent);
  color: var(--color-on-accent);
}

@media (hover: hover) and (pointer: fine) {
  .mini-btn:not([data-primary]):hover,
  .mini-open:hover {
    background: var(--color-surface-sunken);
  }

  .mini-btn[data-primary]:hover {
    background: var(--color-accent-hover);
  }
}

.mini-btn[data-primary]:active {
  background: var(--color-accent-pressed);
}

/* While the player sheet is open, its cover is the one on screen. */
html[data-player="open"] .mini-open .cover {
  visibility: hidden;
}

/* ------------------------------------------------------------------ expanded player */

dialog.player {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--color-on-surface);
  overflow: visible;
}

dialog.player::backdrop {
  background: transparent;
}

.player-scrim {
  position: absolute;
  inset: 0;
  background: var(--color-scrim);
  opacity: 0;
}

.player-panel {
  /* The cover's key color arrives inline from the digest; the app accent is the fallback. */
  --cover-key: var(--color-accent);
  --player-key: var(--color-accent);
  --color-cover-accent: var(--player-key);
  --color-focus-ring: var(--player-key);
  --color-focus-gap: var(--player-surface);
  --player-surface: color-mix(
    in oklch,
    var(--cover-key, var(--color-accent)) calc(var(--player-tint-mix) * 100%),
    var(--color-surface-raised)
  );
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  max-width: var(--layout-column);
  margin-inline: auto;
  padding-block-start: var(--safe-top);
  padding-inline: max(var(--player-padding), var(--safe-left))
    max(var(--player-padding), var(--safe-right));
  background: var(--player-surface);
  transform: translateY(100%);
  will-change: transform;
}

/* Cover accent flows into the player: lightness is pinned per mode so the derived color always
   clears 3:1 against the sheet, whatever the palette. Hue and chroma come from the cover. */
.player-panel[data-cover-key] {
  --player-key: oklch(from var(--cover-key) 0.5 min(c, 0.17) h);
}

:root[data-theme="dark"] .player-panel[data-cover-key] {
  --player-key: oklch(from var(--cover-key) 0.78 min(c, 0.17) h);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .player-panel[data-cover-key] {
    --player-key: oklch(from var(--cover-key) 0.78 min(c, 0.17) h);
  }
}

.player-drag {
  display: flex;
  flex: 0 1 auto;
  flex-direction: column;
  min-height: 0;
  touch-action: none;
}

.player-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: var(--size-touch);
}

.player-bar-date {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.player-cover {
  display: grid;
  place-items: center;
  flex: 0 1 auto;
  min-height: 0;
  padding-block: var(--space-2) var(--space-4);
}

.player-cover .cover {
  --cover-radius: var(--cover-radius-large);
  width: min(100%, var(--cover-size-player), 36dvh);
  transform-origin: top left;
  will-change: transform;
}

.player-meta {
  display: grid;
  gap: var(--space-1);
}

.player-section {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.player-title {
  font-family: var(--text-title-family);
  font-size: var(--text-title-size);
  font-weight: var(--text-title-weight);
  letter-spacing: var(--text-title-tracking);
  line-height: var(--text-title-leading);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.player-source {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.player-controls {
  flex: none;
  padding-block-start: var(--space-4);
}

/* Scrubber */

.scrubber {
  position: relative;
  height: var(--scrubber-hit);
  touch-action: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.scrubber-track,
.scrubber-ticks {
  position: absolute;
  inset-inline: 0;
  inset-block-start: 50%;
}

.scrubber-track {
  height: var(--scrubber-track);
  margin-block-start: calc(var(--scrubber-track) / -2);
  border-radius: var(--radius-xs);
  background: var(--color-track);
  overflow: hidden;
  transition: transform var(--duration-press-out) var(--ease-out);
}

.scrubber[data-dragging] .scrubber-track {
  transform: scaleY(var(--scrubber-track-active));
}

.scrubber-fill {
  display: block;
  height: 100%;
  background: var(--color-cover-accent);
  transform-origin: left;
  transform: scaleX(var(--player-progress, 0));
}

.scrubber-ticks {
  height: 0;
  pointer-events: none;
}

.scrubber-tick {
  --dot: var(--scrubber-tick-dot);
  position: absolute;
  inset-block-start: calc(var(--dot) / -2);
  width: var(--dot);
  height: var(--dot);
  margin-inline-start: calc(var(--dot) / -2);
  border-radius: var(--radius-round);
  background: var(--color-on-surface-muted);
  box-shadow: 0 0 0 var(--stroke-hairline) var(--color-surface);
  transition: background-color var(--duration-state) var(--ease-out);
}

/* The thumb is a zero-size anchor that script moves with transform. The visible disc is a
   pseudo-element, so its press scale never multiplies the anchor's translation (individual
   transform properties apply before the transform property). */
.scrubber-thumb {
  position: absolute;
  inset-block-start: 50%;
  inset-inline-start: 0;
  width: 0;
  height: 0;
  will-change: transform;
}

.scrubber-thumb::before {
  content: "";
  position: absolute;
  inset-block-start: calc(var(--scrubber-thumb) / -2);
  inset-inline-start: calc(var(--scrubber-thumb) / -2);
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  border-radius: var(--radius-round);
  background: var(--color-cover-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--player-surface, var(--color-surface-raised));
  transition: scale var(--duration-spring-pop) var(--ease-spring-pop);
}

.scrubber[data-dragging] .scrubber-thumb::before {
  scale: var(--scrubber-thumb-active-scale);
}

/* The thumb ring is a box-shadow, so the focus ring sits on the whole slider instead. */
.scrubber:focus-visible {
  border-radius: var(--control-radius-sm);
}

.scrubber-bubble {
  position: absolute;
  inset-block-end: calc(100% - var(--space-1));
  inset-inline-start: 0;
  display: grid;
  justify-items: center;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--scrubber-bubble-radius);
  background: var(--color-surface-inverse);
  color: var(--color-on-surface-inverse);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-caption);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-press-in) var(--ease-out);
}

.scrubber[data-dragging] .scrubber-bubble {
  opacity: 1;
}

.scrubber-times {
  display: flex;
  justify-content: space-between;
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.scrubber-times .scrubber-chapter-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Transport controls: five targets, one dominant. */

.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: var(--space-2) var(--space-4);
}

.transport-btn {
  display: grid;
  place-items: center;
  width: var(--control-size-md);
  height: var(--control-size-md);
  border-radius: var(--control-radius-md);
  color: var(--color-on-surface);
}

.transport-btn[data-size="sm"] {
  width: var(--control-size-sm);
  height: var(--control-size-sm);
  border-radius: var(--control-radius-sm);
  color: var(--color-on-surface-muted);
}

.transport-btn[data-primary] {
  width: var(--control-size-lg);
  height: var(--control-size-lg);
  border-radius: var(--control-radius-lg);
  background: var(--color-cover-accent);
  color: var(--color-on-cover-accent);
}

.transport-btn[data-primary] .icon {
  width: var(--size-icon-lg);
  height: var(--size-icon-lg);
}

.transport-btn .icon {
  width: var(--size-icon-lg);
  height: var(--size-icon-lg);
}

@media (hover: hover) and (pointer: fine) {
  .transport-btn:not([data-primary]):hover {
    background: var(--color-surface-sunken);
    color: var(--color-on-surface);
  }
}

.transport-btn[data-primary][aria-busy="true"] .icon {
  opacity: 0;
}

.skip-label {
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-bold);
}

.player-scroll {
  flex: 1 1 0;
  min-height: 0;
  margin-inline: calc(var(--player-padding) * -1);
  padding-inline: var(--player-padding);
  padding-block-end: max(var(--space-6), var(--safe-bottom));
}

.player-section-title {
  margin-block: var(--space-4) var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.chapter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  width: 100%;
  min-height: var(--size-touch-comfortable);
  padding-inline: var(--space-4);
  border-radius: var(--sheet-row-radius);
  text-align: start;
  font-weight: var(--font-weight-semibold);
}

.chapter-row[aria-current="true"] {
  background: color-mix(in oklch, var(--color-cover-accent) 12%, transparent);
  color: var(--color-on-surface);
}

.chapter-row[aria-current="true"] .chapter-row-name::before {
  content: "";
  display: inline-block;
  width: var(--space-2);
  height: var(--space-2);
  margin-inline-end: var(--space-4);
  border-radius: var(--radius-xs);
  background: var(--color-cover-accent);
}

.chapter-row-time {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

@media (hover: hover) and (pointer: fine) {
  .chapter-row:hover {
    background: var(--color-surface-sunken);
  }
}

/* ------------------------------------------------------------------ sheets: content */

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-block-end: var(--space-2);
  padding-inline-start: var(--space-2);
}

.sheet-title {
  font-family: var(--text-heading-family);
  font-size: var(--font-size-label-lg);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--font-tracking-label-lg);
}

.sheet-lede {
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.sheet-group {
  margin-block-start: var(--space-6);
}

.sheet-group > legend,
.sheet-group > h3 {
  padding-inline: var(--space-2);
  margin-block-end: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

/* Segmented control: native radios, so arrow keys and form state come free. */

.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: var(--segmented-padding);
  border-radius: var(--segmented-radius);
  background: var(--color-surface-sunken);
}

.segmented label {
  position: relative;
  display: grid;
  place-items: center;
  min-height: calc(var(--segmented-height) - var(--segmented-padding) * 2);
  border-radius: var(--segmented-segment-radius);
  color: var(--color-on-surface-muted);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-meta);
  transition:
    background-color var(--duration-hover) var(--ease-hover),
    color var(--duration-hover) var(--ease-hover),
    transform var(--duration-press-out) var(--ease-out);
}

.segmented label:active {
  transform: scale(var(--scale-press));
  transition-duration: var(--duration-press-in), var(--duration-hover), var(--duration-hover);
}

.segmented input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.segmented {
  --segment-selected-bg: var(--segmented-selected-bg);
  --segment-selected-fg: var(--color-on-surface);
}

/* The selected segment is raised and ringed, so selection never depends on color alone. */
.segmented label:has(input:checked) {
  background: var(--segment-selected-bg);
  color: var(--segment-selected-fg);
  box-shadow:
    0 0 0 var(--stroke-hairline) color-mix(in oklch, var(--color-on-surface) 14%, transparent),
    0 1px 2px color-mix(in oklch, var(--color-on-surface) 14%, transparent);
}

.segmented label:has(input:focus-visible) {
  outline: var(--stroke-ring) solid var(--color-focus-ring);
  outline-offset: var(--stroke-ring-gap);
}

.player-panel .segmented {
  --segment-selected-bg: var(--color-cover-accent);
  --segment-selected-fg: var(--color-on-cover-accent);
}

@media (hover: hover) and (pointer: fine) {
  .segmented label:hover {
    color: var(--color-on-surface);
  }
}

/* Switch row */

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch-comfortable);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--sheet-row-radius);
}

.setting-text {
  display: grid;
}

.setting-hint {
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.switch {
  appearance: none;
  position: relative;
  flex: none;
  width: var(--switch-width);
  height: var(--switch-height);
  margin: 0;
  border-radius: var(--switch-radius);
  background: var(--color-track-strong);
  cursor: pointer;
  transition: background-color var(--duration-state) var(--ease-out);
}

.switch::before {
  content: "";
  position: absolute;
  inset-block-start: var(--switch-padding);
  inset-inline-start: var(--switch-padding);
  width: var(--switch-thumb);
  height: calc(var(--switch-height) - var(--switch-padding) * 2);
  border-radius: var(--switch-thumb-radius);
  background: var(--switch-thumb-bg);
  box-shadow: 0 1px 2px color-mix(in oklch, var(--color-on-surface) 30%, transparent);
  transition: transform var(--duration-state) var(--ease-out);
}

.switch:checked {
  background: var(--color-accent);
}

.switch:checked::before {
  transform: translateX(
    calc(var(--switch-width) - var(--switch-thumb) - var(--switch-padding) * 2)
  );
}

.switch:active::before {
  transform: scaleX(1.12);
}

.switch:checked:active::before {
  transform: translateX(calc(var(--switch-width) - var(--switch-thumb) - var(--switch-padding) * 2))
    scaleX(1.12);
}

/* Range */

.range {
  appearance: none;
  width: 100%;
  height: var(--size-touch);
  margin: 0;
  background: transparent;
  cursor: pointer;
}

.range::-webkit-slider-runnable-track {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: linear-gradient(
    to right,
    var(--color-accent) var(--range-fill, 0%),
    var(--color-track) var(--range-fill, 0%)
  );
}

.range::-moz-range-track {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: var(--color-track);
}

.range::-moz-range-progress {
  height: var(--scrubber-track);
  border-radius: var(--radius-xs);
  background: var(--color-accent);
}

.range::-webkit-slider-thumb {
  appearance: none;
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  margin-block-start: calc((var(--scrubber-track) - var(--scrubber-thumb)) / 2);

  border-radius: var(--radius-round);
  background: var(--color-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--color-surface-raised);

.range::-moz-range-thumb {
  width: var(--scrubber-thumb);
  height: var(--scrubber-thumb);
  border: 0;
  border-radius: var(--radius-round);
  background: var(--color-accent);
  box-shadow: 0 0 0 var(--scrubber-thumb-ring) var(--color-surface-raised);
}

.range:disabled {
  cursor: default;
  opacity: var(--opacity-disabled);
}

/* Install hint */

.hint-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-4);
  padding: var(--banner-padding);
  border-radius: var(--banner-radius);
  background: var(--color-surface-sunken);
}

.hint-card .icon {
  margin-block-start: 0.125rem;
  color: var(--color-accent);
}

.hint-card p {
  font-size: var(--font-size-meta);
  color: var(--color-on-surface-muted);
}

.hint-card strong {
  display: block;
  color: var(--color-on-surface);
  font-size: var(--font-size-body);
}

.hint-card .btn {
  grid-column: 2;
  justify-self: start;
  margin-inline-start: calc(var(--space-4) * -1);
}

/* Fields */

.field {
  display: grid;
  gap: var(--space-2);
  margin-block-start: var(--space-4);
}

.field label {
  padding-inline: var(--space-2);
  font-weight: var(--font-weight-semibold);
}

.field input[type="password"],
.field input[type="text"],
.field select {
  min-height: var(--field-height);
  padding-inline: var(--field-padding);
  border: var(--stroke-hairline) solid var(--field-border);
  border-radius: var(--field-radius);
  background: var(--field-bg);
  color: var(--color-on-surface);
}

.field input[aria-invalid="true"] {
  border-color: var(--color-danger);
}

.field-hint {
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.field-error {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding-inline: var(--space-2);
  color: var(--color-danger);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-semibold);
}

.field-error .icon {
  width: 1rem;
  height: 1rem;
  margin-block-start: 0.125rem;
}

.sheet-actions {
  display: grid;
  gap: var(--space-2);
  margin-block-start: var(--space-4);
}

.botcheck {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding-inline: var(--space-2);
  color: var(--color-on-surface-muted);
  font-size: var(--font-size-meta);
}

.botcheck[data-state="ok"] .icon {
  color: var(--color-success);
}

/* Generate progress: the rail grammar again, as a short vertical list. */

.run-steps {
  position: relative;
  display: grid;
  margin-block-start: var(--space-6);
  padding-inline-start: var(--rail-gutter);
}

.run-steps::before {
  content: "";
  position: absolute;
  inset-block: var(--space-4);
  inset-inline-start: calc(var(--rail-center) - var(--rail-width) / 2);
  width: var(--rail-width);
  border-radius: var(--stroke-rail);
  background: var(--rail-track);
}

.run-step {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  min-height: var(--size-touch);
  color: var(--color-on-surface-muted);
  transition: color var(--duration-state) var(--ease-hover);
}

.run-step::before {
  content: "";
  position: absolute;
  inset-inline-start: calc(var(--rail-center) - var(--rail-gutter) - var(--rail-node) / 2);
  width: var(--rail-node);
  height: var(--rail-node);
  border-radius: var(--radius-round);
  background: var(--color-surface-raised);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-node-idle);
  transition:
    background-color var(--duration-state) var(--ease-out),
    box-shadow var(--duration-state) var(--ease-out);
}

.run-step[data-state="done"] {
  color: var(--color-on-surface);
}

.run-step[data-state="done"]::before {
  background: var(--rail-fill);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--rail-fill);
}

.run-step[data-state="active"] {
  color: var(--color-on-surface);
  font-weight: var(--font-weight-semibold);
}

.run-step[data-state="active"]::before {
  background: var(--rail-fill);
  box-shadow:
    0 0 0 var(--rail-node-ring) var(--rail-fill),
    0 0 0 var(--rail-node-halo) color-mix(in oklch, var(--rail-fill) 24%, transparent);
}

.run-step[data-state="failed"] {
  color: var(--color-danger);
  font-weight: var(--font-weight-semibold);
}

.run-step[data-state="failed"]::before {
  background: var(--color-danger);
  box-shadow: 0 0 0 var(--rail-node-ring) var(--color-danger);
}

.run-step-state {
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}

.run-result {
  margin-block-start: var(--space-4);
}

/* ------------------------------------------------------------------ toast */

.toast {

    calc(
      max(var(--mini-player-inset), var(--safe-bottom)) +
      var(--mini-player-control-size) +
      var(--mini-player-inset) *
      2 +
      var(--space-2)

    0;

  align-items: center;
  gap: var(--space-4);
  width: max-content;
  max-width: min(calc(100% - var(--page-gutter) * 2), var(--layout-dialog));
  min-height: var(--toast-min-height);
  margin-inline: auto;
  padding: var(--toast-padding) var(--toast-padding) var(--toast-padding) var(--space-4);
  border: 0;
  border-radius: var(--toast-radius);
  background: var(--toast-bg);
  color: var(--toast-fg);
  box-shadow: var(--toast-shadow);
  --color-focus-gap: var(--color-surface-inverse);
  opacity: 0;
  transform: translateY(var(--distance-medium));

    opacity var(--duration-exit) var(--ease-out),
    transform var(--duration-exit) var(--ease-out),
    overlay var(--duration-exit) allow-discrete,
    display var(--duration-exit) allow-discrete;
}

.toast:popover-open {
  opacity: 1;
  transform: none;
  transition-duration: var(--duration-enter);
}

@starting-style {
  .toast:popover-open {
    opacity: 0;
    transform: translateY(var(--distance-medium));
  }
}

.toast-action {
  min-height: var(--size-touch);
  padding-inline: var(--space-4);
  border-radius: var(--control-radius-sm);
  font-weight: var(--font-weight-semibold);
  background: color-mix(in oklch, var(--toast-fg) 14%, transparent);
}

.toast-action:focus-visible {
  outline-color: var(--toast-fg);
}

/* ------------------------------------------------------------------ chapters aside (wide) */

.aside {
  display: none;
}

@media (min-width: 64rem) {
  .shell {
    display: grid;
    grid-template-columns: var(--layout-aside) minmax(0, var(--layout-column));
    column-gap: var(--space-12);
    justify-content: center;
    max-width: none;
  }

  /* Header and banners span the same width as the aside plus the column, so the wordmark sits
     over the aside and the actions over the reading column. */
  .site-header-inner,
  .banner-stack {
    max-width: calc(
      var(--layout-aside) +
      var(--space-12) +
      var(--layout-column) +
      var(--page-gutter) *
      2
    );
  }

  .aside {
    position: sticky;
    inset-block-start: calc(var(--header-height, 3.5rem) + var(--safe-top) + var(--space-6));
    align-self: start;
    display: grid;
    gap: var(--space-4);
    padding-block-start: var(--space-6);
  }

  .aside .cover {
    --cover-radius: var(--cover-radius-hero);
    width: 100%;
  }

  .aside-nav {
    display: grid;
  }

  .aside-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    min-height: var(--size-touch);
    padding-inline: var(--space-4);
    margin-inline: calc(var(--space-4) * -1);
    border-radius: var(--sheet-row-radius);
    color: var(--color-on-surface-muted);
    font-size: var(--font-size-meta);
    font-weight: var(--font-weight-semibold);
    text-decoration: none;
  }

  .aside-link[data-state="current"] {
    color: var(--color-on-surface);
    background: var(--color-accent-subtle);
  }

  @media (hover: hover) and (pointer: fine) {
    .aside-link:hover {
      background: var(--color-surface-sunken);
      color: var(--color-on-surface);
    }
  }

/* ------------------------------------------------------------------ wider screens */

@media (min-width: 40rem) {
  .hero {
    grid-template-columns: var(--cover-size-hero-wide) minmax(0, 1fr);

  }

  /* The player becomes a centered modal card. Modals stay centered and scale in; the cover

  .player-panel {
    inset: 0;
    margin: auto;
    width: var(--layout-player-dialog);
    max-width: 100%;
    height: fit-content;
    max-height: calc(100dvh - var(--space-12));

  .player-cover .cover {

  }

  .nav-archive {
    display: inline-flex;
  }
}

/* ------------------------------------------------------------------ small additions */

.nav-archive {
  display: none;
}

   arrives. Small, fast, and keyed on the button's data-playing. */
.swap {

  display: grid;
  place-items: center;
}

.swap > .icon {

}

.skip-label {
  font-size: 8px;
  font-weight: var(--font-weight-bold);
  font-family: var(--font-ui);
}

[data-loading="true"] > .swap {
  opacity: 0;
}

  position: absolute;
  color: var(--color-on-cover-accent);
}

.transport-btn[data-primary] {
  position: relative;
}

.transport-btn[data-primary][data-loading="true"] .spinner {
  display: block;
}

.toast-dismiss {

  place-items: center;
  width: var(--size-touch);

}

.toast-dismiss:focus-visible {

}

.proto-group > summary {

  list-style: none;
}

.proto-group > summary::-webkit-details-marker {
  display: none;
}

.proto-group {
  padding-block-start: var(--space-4);
  border-block-start: var(--stroke-hairline) solid var(--color-border-hairline);
}

.proto-group select {
  font-size: var(--font-size-body);
}

/* ------------------------------------------------------------------ view transitions */

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: var(--duration-state);
  animation-timing-function: var(--ease-out);
}

::view-transition-group(mini-player) {
  animation: none;
}

/* ------------------------------------------------------------------ forced colors */

@media (forced-colors: active) {
  .rail {
    background: GrayText;
  }

  .rail-fill,
  .mini-progress-fill,
  .scrubber-fill {
    background: Highlight;
  }

  .node,
  .chapter-node {
    border: var(--stroke-rail) solid CanvasText;
  }

  .item[data-state="current"] .node,
  .item[data-state="played"] .node,
  .chapter[data-state="current"] .chapter-node,

    background: Highlight;
    border-color: Highlight;
  }

  .scrubber-thumb {
    background: Highlight;
    forced-color-adjust: none;
  }

  .mini,
  .cover {
    border: var(--stroke-hairline) solid CanvasText;
  }

  .switch {
    border: var(--stroke-rail) solid ButtonText;
  }

  .switch:checked {
    background: Highlight;
  }
}

.colon {
  display: inline-block;
  width: 0.34em;
  text-align: center;

  font-variant-numeric: proportional-nums;
  font-feature-settings: "tnum" 0;
}

/* ------------------------------------------------------------------ refinements */

.back-link {
  margin-inline-start: calc(var(--space-4) * -1);
}

  transition: transform var(--duration-state) var(--ease-out);
}

.year-group[open] > summary .icon {
  transform: rotate(180deg);
}

.btn-primary[data-busy="true"] {
  cursor: progress;
}

.btn-primary[data-busy="true"] .spinner {
  color: var(--cta-fg);
}

/* Containers that take focus on open (sheets, the player) show no ring of their own. */
.player-panel:focus-visible {
  outline: none;
  box-shadow: none;
}

.setting-stack {
  display: grid;
  gap: 0;
  padding: var(--space-2) var(--space-2) 0;
}

.setting-stack > label {
  font-weight: var(--font-weight-regular);
}

  width: calc(100% + var(--space-2) * 2);
}

.hint-card strong {
  margin-block-end: var(--space-1);
}

.field + .botcheck {
  margin-block-start: var(--space-4);
}

@media (max-width: 23.5rem) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--space-4);
  }

  .hero .cover {
    width: 6.5rem;
  }
}

/* Component rules that set display must not defeat the hidden attribute. Keep this rule last. */
[hidden] {
  display: none;
}

/* The mini player owns vertical pans on itself, so a swipe up reaches script instead of scrolling the page. */
.mini-open {
  touch-action: none;
}

.node,
.chapter-node {
  pointer-events: none;
}

    if (target.id === "stateSelect") {
      pageState = target.value;
      renderRoute(false);
    }
    if (target.id === "slowSwitch") player.setBufferDelay(target.checked ? 1400 : 0);
    if (target.id === "voiceSwitch") player.setVoiceEnabled(target.checked);
  });
  settingsDialog.addEventListener("input", (event) => {
    const target = event.target;
    if (target.id === "volumeRange") {
      prefs.volume = Number(target.value);
      target.style.setProperty("--range-fill", `${prefs.volume * 100}%`);
      savePrefs();
    }
  });
  var volumeRange = settingsDialog.querySelector("#volumeRange");
  volumeRange?.style.setProperty("--range-fill", `${prefs.volume * 100}%`);
  if (prefs.installHidden) settingsDialog.querySelector("#installHint")?.setAttribute("hidden", "");
  settingsDialog.querySelector("#hideInstall")?.addEventListener("click", () => {
    prefs.installHidden = true;
    savePrefs();
    settingsDialog.querySelector("#installHint")?.setAttribute("hidden", "");
  });
  document.addEventListener("click", (event) => {
    const target = event.target;
    const closest = (selector) => target.closest(selector);
    if (closest('a[href="#"], a[href="#run"]')) {
      event.preventDefault();
      return;
    }
    const cta = closest("#cta");
    if (cta) {
      if (cta.getAttribute("aria-disabled") !== "true") togglePlayback();
      return;
    }
    const play = closest("[data-play]");
    if (play) {
      playItem(Number(play.dataset.play));
      return;
    }
    const chapter = closest("[data-chapter-play]");
    if (chapter) {
      playItem(Number(chapter.dataset.chapterPlay));
      return;
    }
    if (closest("#openGenerate") || closest('[data-open="generate"]')) {
      openSheet(generateDialog);
      return;
    }
    if (closest("#openSettings")) {
      openSheet(settingsDialog);
      return;
    }
    const dismiss = closest("[data-close]");
    if (dismiss) {
      dismiss.closest("dialog")?.close();
      return;
    }
    if (closest('[data-action="retry"]')) {
      pageState = "normal";
      renderRoute();
    }
  });
  window.addEventListener("online", () => announce("You are back online."));
  window.addEventListener("offline", () => announce("You are offline."));
  renderRoute(false);
  syncPlayback(player.getState());
  var stateSelect = settingsDialog.querySelector("#stateSelect");
  if (stateSelect) stateSelect.value = pageState;
  var at = params.get("at");
  if (at !== null) {
    const index = Math.min(ITEMS.length - 1, Math.max(0, Number(at)));
    const entry2 = timeline.items[index];
    if (entry2) {
      player.seek(entry2.startSec + (entry2.endSec - entry2.startSec) * 0.42);
      player.play();
      if (params.get("play") !== "1") player.pause();
    }
  }
  var open = params.get("open");
  if (open === "player") playerSheet.open();
  if (open === "generate") openSheet(generateDialog);
  if (open === "settings") openSheet(settingsDialog);
  window.singularityPrototype = { player, sound, prefs };
})();
</script>
</body>
</html>
