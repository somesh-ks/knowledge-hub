# The default rules, plus the invented values the tests assert on. Each entry below is a literal
# written for a test; none is a credential. Add a value here only when it is made up, and never
# allow a whole path: a real key pasted into a test must still fail the scan.
title = "knowledge-hub"

[extend]
useDefault = true

[allowlist]
description = "Invented values in tests"
regexes = [
  '''speechify-test-key-[0-9a-f]+''',
  '''vercel_blob_rw_AbCd1234EfGh_\w+''',
  '''key-123456789''',
  '''an-e2e-secret-of-enough-length''',
  '''a1b2c3d4e5f6''',
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJvd25lcjpkaXNwYXRjaCJ9\.c2lnbmF0dXJlLWJ5dGVz''',
]
